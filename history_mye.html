*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:#f5f6fa;color:#1a1a2e;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:640px;margin:0 auto;padding:16px 14px 110px}

.stat span{font-size:13px;color:#555}

.btn-sec{background:#fff;color:#c62828;border:2px solid #c62828;margin-top:10px}

.topics{display:grid;gap:10px;margin-top:14px}
.topics.two{grid-template-columns:1fr 1fr}
.tcard{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:10px 11px}

.tmeta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#555;margin:5px 0 6px}
.half{color:#f57c00;font-weight:700;cursor:help}
.tcard .bar{height:7px}
.qtop{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;gap:8px}
.badge{border:1.5px solid;background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.qnum{font-size:14px;font-weight:600;color:#555}
.home-link{background:none;border:none;color:#6b6b80;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:underline}
.qtext{font-size:20px;font-weight:700;text-align:center;line-height:1.35;margin:4px 0 14px}
.hintbtn{background:#fff;border:1.5px dashed #9a9ab0;color:#444;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;width:100%;font-family:inherit;text-align:left}
.hintbtn:disabled{background:#eceef3;color:#9a9ab0;border-color:#c9cad6;cursor:not-allowed}
.hint{display:none;font-size:14px;background:#f4f4fb;border-radius:8px;padding:9px 12px;margin-top:6px;color:#333}
.opts{margin-top:14px;display:grid;gap:10px}
.opt{background:#fff;border:2px solid #dcdde6;border-radius:10px;padding:13px 14px;font-size:16px;text-align:left;cursor:pointer;font-family:inherit;color:#1a1a2e;transition:background .15s,border-color .15s,color .15s}
.opt:hover:not(:disabled){border-color:#1a1a2e}
.opt:disabled{cursor:default}
.opt.ok{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;font-weight:600}
.opt.bad{background:#ffebee;border-color:#c62828;color:#b71c1c}
.expl{display:none;margin-top:14px;font-size:15px}
.expl .verdict{font-weight:800;margin-bottom:4px}
.insight{display:none;margin-top:10px;border:1.5px solid #1a1a2e;background:#f3f4fa;border-radius:10px;padding:11px 13px;font-size:14.5px}
.insight b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#555;margin-bottom:3px}
.nextbar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(245,246,250,0),#f5f6fa 30%);display:none}
.nextbar .btn{max-width:612px;margin:0 auto}
.score{text-align:center;padding:10px 0}
.score b{font-size:46px;font-weight:800}
.done-badge{display:none;text-align:center;background:#e8f5e9;color:#2e7d32;font-weight:700;border-radius:999px;padding:8px 14px;margin:6px auto 4px;width:fit-content}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #eee}
th{font-size:12.5px;color:#666;font-weight:600}
td.n,th.n{text-align:center}
.modal{position:fixed;inset:0;background:rgba(26,26,46,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.on{display:flex}
.modal .card{max-width:380px;width:100%;text-align:center}
.modal p{margin:6px 0 16px;font-size:16px}
.mrow{display:flex;gap:10px}
.mrow .btn{margin:0}
.btn-danger{background:#c62828;color:#fff}
@media (max-width:400px){.hdr h1{font-size:22px}.qtext{font-size:18px}.tname{font-size:13px}.topics.two{gap:8px}.tcard{padding:9px}}
</style>

<script>
const BANK = [
// ===================== KEY CONCEPTS (32) =====================
{t:"Key Concepts",q:"Which statement best defines a 'cause' in History?",
o:["The conditions or events that make something happen, including long-term factors and triggers.","The results that follow an event, which can be felt over the short, medium and long term.","The reasons a historian gives for judging that an event is still important to people today.","The particular viewpoint a person holds about an event, shaped by their culture and background."],a:0,
h:"Think about what comes BEFORE an event.",
expl:"A cause is something (or the conditions) that makes an event happen. Causes can be long-term, medium-term or short-term, and include triggers.",
insight:"Cause = the conditions which make something happen; long-term, medium-term and short-term, including triggers."},
{t:"Key Concepts",q:"Which statement best defines a 'consequence' in History?",
o:["The conditions that existed before an event and slowly made it more likely to happen.","The result of an event, meaning what happens because that event took place.","The meaning or conclusion a historian draws from carefully observing the evidence.","The single short-term event that sparks a long-building crisis into open conflict."],a:1,
h:"Think about what comes AFTER an event.",
expl:"A consequence is the result of an event: what happens because of it. Option A describes a cause, C an interpretation, D a trigger.",
insight:"Consequence = the result of an event; consequences can be political, economic, social and/or cultural."},
{t:"Key Concepts",q:"In History, what is a 'trigger'?",
o:["A long-term cause that slowly builds up tension over many decades before an event finally happens.","A consequence that appears suddenly in the first few years straight after an event has ended.","A short-term cause that sets an event off once longer-term pressures have built up.","A primary source that historians use to test whether a particular interpretation is reliable."],a:2,
h:"Think of the spark that lights a fire that was already prepared.",
expl:"A trigger is the immediate, short-term cause that sets an event off after long- and medium-term causes have built up.",
insight:"Trigger = the short-term cause that immediately sparks an event."},
{t:"Key Concepts",q:"A government passes a new law banning an opposition party. Which PESC category best fits this?",
o:["Political","Economic","Social","Cultural"],a:0,
h:"Laws, power and decision making in government.",
expl:"Laws, power and control over who can take part in government are political.",
insight:"Political = power and control, conflict, laws and decision making in government."},
{t:"Key Concepts",q:"Britain forces Indian farmers to grow opium for profit instead of food crops. Which PESC factor is MOST directly shown?",
o:["Political","Economic","Social","Cultural"],a:1,
h:"Ask: is the main aim about money and resources?",
expl:"Using land and labour to make profit from a cash crop is about money and resources, so it is economic.",
insight:"Economic = money and resources; how limited resources are used to meet unlimited wants."},
{t:"Key Concepts",q:"After years of forced labour, families are split up and village community life breaks down. Which PESC category best describes this impact?",
o:["Political","Economic","Social","Cultural"],a:2,
h:"Think about how people live together and interact.",
expl:"Families and community life are about how people behave and interact in society, so this is social.",
insight:"Social = how people behave; community life and interaction between individuals and groups."},
{t:"Key Concepts",q:"During the Meiji era, Japanese officials begin wearing Western suits and adopting Western art styles. Which PESC category best fits?",
o:["Political","Economic","Social","Cultural"],a:3,
h:"Clothing and art are ways people express themselves.",
expl:"Clothing, arts and traditions are part of a group's shared way of life, so this is cultural.",
insight:"Cultural = how people express themselves: shared habits, beliefs, traditions, arts and way of life."},
{t:"Key Concepts",q:"Which definition matches 'economic' in the PESC framework?",
o:["Anything to do with power and control, conflict, laws and decision making in government.","Anything to do with how people behave and interact with each other in community life.","Anything to do with shared beliefs, traditions, arts and a group's whole way of life.","Anything to do with money and resources, and how limited resources meet unlimited wants."],a:3,
h:"Think about money and what people can afford.",
expl:"Economic factors are about money and resources and how people choose to use limited resources.",
insight:"Economic = money and resources; how limited resources are used to meet unlimited wants."},
{t:"Key Concepts",q:"Which definition matches 'cultural' in the PESC framework?",
o:["Anything to do with the shared habits, beliefs, traditions and arts of a group of people.","Anything to do with how businesses, households and governments use limited money and resources.","Anything to do with laws, conflict and the decisions that governments make about power and control.","Anything to do with community life and how individuals and different groups interact with each other."],a:0,
h:"Think about how people express who they are.",
expl:"Cultural factors cover the way people express themselves: their habits, beliefs, traditions and arts.",
insight:"Cultural = shared habits, beliefs, traditions, arts and way of life of a group."},
{t:"Key Concepts",q:"Which key term means 'why an event is important'?",
o:["Significance","Consequence","Perspective","Interpretation"],a:0,
h:"The 5 R's are used to measure this.",
expl:"Significance is why an event matters. Historians test it with the 5 R's.",
insight:"Significance = why something/an event is important."},
{t:"Key Concepts",q:"Which key term means 'a way of viewing something, shaped by a person's culture, way of thinking or background'?",
o:["Interpretation","Significance","Perspective","Consequence"],a:2,
h:"Two people can look at the same event from different angles.",
expl:"A perspective is a viewpoint shaped by someone's culture or background.",
insight:"Perspective = a way of viewing something, shaped by an individual's culture, way of thinking or background."},
{t:"Key Concepts",q:"A historian studies a cartoon and concludes that it criticises Leopold II. Which key term best describes that conclusion?",
o:["Perspective","Interpretation","Consequence","Significance"],a:1,
h:"It is the meaning you draw from what you observe.",
expl:"An interpretation is the specific meaning or conclusion drawn from what is observed in evidence.",
insight:"Interpretation = the specific meaning, explanation or conclusion you draw from what you observe."},
{t:"Key Concepts",q:"Which of these is NOT one of the 5 R's of historical significance?",
o:["Remarkable","Radiant","Reliable","Revealing"],a:2,
h:"One of these words belongs to source analysis, not significance.",
expl:"The 5 R's are Remarkable, Resulted in change, Radiant, Relevant and Revealing. 'Reliable' is used when judging sources.",
insight:"5 R's = Remarkable, Resulted in change, Radiant, Relevant, Revealing."},
{t:"Key Concepts",q:"In the 5 R's, what does it mean if an event is 'Radiant'?",
o:["The event was shocking at the time and made people stop and take notice of it.","The event still matters today, and its impact shows in modern laws or technology.","The event opens a window into what people at the time valued, feared or believed.","The event spread out like ripples in a pond and affected people all over the world."],a:3,
h:"Think of light spreading outward.",
expl:"Radiant means the event's effects spread widely, like ripples, reaching many people and places.",
insight:"Radiant = the event spread out like ripples, affecting people all over the world, not just one small group."},
{t:"Key Concepts",q:"Which 'R' asks whether an event opens a window into what people valued, feared or believed at the time?",
o:["Relevant","Revealing","Remarkable","Radiant"],a:1,
h:"It 'reveals' something about the past.",
expl:"Revealing asks what the event teaches us about people's values, fears and beliefs at that time.",
insight:"Revealing = the event opens a window into the past, showing what people valued, feared or believed."},
{t:"Key Concepts",q:"A student argues the Berlin Conference is significant because many African borders today still follow its lines. Which 'R' is this?",
o:["Radiant","Revealing","Remarkable","Relevant"],a:3,
h:"Does it still matter to us today?",
expl:"Showing that an event still affects the world today is the 'Relevant' test.",
insight:"Relevant = the event still matters today; its impact can be seen in modern lives, laws or technology."},
{t:"Key Concepts",q:"The Industrial Revolution built up a need for raw materials for decades before the Scramble for Africa. What type of cause is this?",
o:["Short-term cause","Long-term cause","Immediate trigger","Medium-term consequence"],a:1,
h:"It built up slowly over many decades.",
expl:"A cause that builds over many decades before an event is a long-term cause.",
insight:"Long-term causes build over many years; short-term causes and triggers happen just before an event."},
{t:"Key Concepts",q:"The 'Fan Incident' led straight to France invading Algeria in 1830. What type of cause was it?",
o:["Long-term cause","Medium-term cause","Long-term consequence","Immediate trigger"],a:3,
h:"It came right before the invasion and set it off.",
expl:"An event that immediately sets off another event is a trigger, the most short-term type of cause.",
insight:"Trigger = the short-term cause that immediately sparks an event (e.g. the Fan Incident for the invasion of Algeria)."},
{t:"Key Concepts",q:"Which statement describes a protectorate?",
o:["A territory that the imperialist power rules directly through its own appointed officials, like British India.","A country that keeps its local government, while officials of a foreign power guide its policies.","A region of a country or continent in which one foreign power holds exclusive investment or trading rights.","An independent but less developed nation that is controlled by foreign private businesses, not governments."],a:1,
h:"The local government still exists, but someone else is guiding it.",
expl:"In a protectorate the local government remains, but a foreign power's officials guide its policies.",
insight:"Protectorate = local government, but officials of a foreign power guide its policies."},
{t:"Key Concepts",q:"Which statement describes a sphere of influence?",
o:["A region in which one imperialist power holds exclusive rights to invest or to trade.","A territory ruled directly by the imperialist power, such as British India or Australia.","A country whose own rulers stay in place but follow policies set by foreign officials.","A nation controlled by foreign private companies instead of by a foreign government."],a:0,
h:"Think of 'exclusive rights' rather than full rule.",
expl:"A sphere of influence is a region where one imperialist power has exclusive investment or trading rights.",
insight:"Sphere of influence = region in which an imperialist power held exclusive investment or trading rights."},
{t:"Key Concepts",q:"A weak but independent country is controlled by foreign private companies rather than a foreign government. Which form of imperialism is this?",
o:["Direct rule","Indirect rule","Economic imperialism","Colonial rule"],a:2,
h:"Who is in control here: businesses or governments?",
expl:"When private businesses, not foreign governments, control an independent nation, it is economic imperialism.",
insight:"Economic imperialism = independent but less developed nations controlled by private businesses rather than other governments."},
{t:"Key Concepts",q:"After 1858, Britain ruled India directly through its own government. Which form of imperialism is this?",
o:["Protectorate","Mandate","Commonwealth","Colony"],a:3,
h:"The slides use British India as the main example of this form.",
expl:"A colony is a territory an imperialist power rules directly, such as British India.",
insight:"Colony = a territory that an imperialist power ruled directly (e.g. British India, Australia)."},
{t:"Key Concepts",q:"Nations grabbed colonies for wealth and prestige so that a rival country would not upstage them. Which cause of imperialism is this?",
o:["New markets","Civilizing mission","Political rivalries","Religious freedom"],a:2,
h:"Think about competition between European nations.",
expl:"Competing with rival nations for prestige and wealth is the cause called political rivalries.",
insight:"Political rivalries: nations sought colonies for wealth and prestige so they would not be upstaged by a rival."},
{t:"Key Concepts",q:"Why did the Industrial Revolution push Europeans to look for colonies as new markets?",
o:["Factories needed fewer workers after mechanization, so colonies offered new jobs for unemployed Europeans.","Governments taxed factories heavily at home, so colonies were needed to raise extra state income instead.","Factories produced a huge surplus of goods, and colonies provided new consumers for them.","Factory owners faced strict new laws in Europe, so they moved all their production out to the colonies."],a:2,
h:"Factories were making more than people at home could buy.",
expl:"The Industrial Revolution created a surplus of goods, and colonies supplied new consumers to buy them.",
insight:"Desire for new markets: the Industrial Revolution created a huge surplus of goods; colonies provided new consumers."},
{t:"Key Concepts",q:"The 'civilizing mission' was also known as the...",
o:["Open Door Policy","White Man's Burden","Divide and Rule","Balance of Power"],a:1,
h:"It is a phrase from a famous poem about European 'duty'.",
expl:"The civilizing mission, linked to Christian missionaries, was also called the White Man's Burden.",
insight:"Civilizing Mission = the White Man's Burden; missionaries sought to Christianize Africa and Asia, driven by Social Darwinism."},
{t:"Key Concepts",q:"Which idea drove the civilizing mission by wrongly claiming some races were 'fitter' and should rule others?",
o:["Free Trade","Absolute Monarchy","Social Darwinism","Mandala System"],a:2,
h:"It misapplied a scientist's theory about evolution to society.",
expl:"Social Darwinism misused ideas about evolution to claim some peoples were superior and should rule others.",
insight:"The civilizing mission was driven by Social Darwinism."},
{t:"Key Concepts",q:"What is the difference between direct rule and indirect rule?",
o:["Direct rule uses the colonizer's own officials, while indirect rule works through local rulers.","Direct rule uses local rulers as officials, while indirect rule sends European officials instead.","Direct rule is used only in Asian colonies, while indirect rule is used only in African ones.","Direct rule means open free trade, while indirect rule means one power holds trading rights."],a:0,
h:"'Indirect' means going through someone else.",
expl:"Direct rule governs through the colonizer's own officials; indirect rule governs through existing local rulers.",
insight:"Direct rule = colonizer's own officials govern; indirect rule = local rulers govern on the colonizer's behalf."},
{t:"Key Concepts",q:"What did the French policy of assimilation aim to do?",
o:["Let colonized peoples keep their own customs while they cooperated with French rulers.","Hand local territory back to traditional chiefs once French trade had been secured.","Make colonized peoples adopt the French language, culture and laws to become 'French'.","Share each colony equally with Britain in order to reduce conflict between the empires."],a:2,
h:"'Assimilate' means to absorb into something.",
expl:"Assimilation aimed to turn colonized peoples into French people in language, culture and law. Option A describes association.",
insight:"Assimilation = colonized peoples absorbed into French culture; Association = local customs kept, cooperation with rulers."},
{t:"Key Concepts",q:"In a PEEL paragraph, what does the 'L' stand for?",
o:["Logic","List","Link","Length"],a:2,
h:"The last step connects back to the question.",
expl:"PEEL = Point, Explanation, Evidence, Link. The Link connects your argument back to the question.",
insight:"Link = link back to the question and make a final statement."},
{t:"Key Concepts",q:"In a PEEL paragraph for Question B, what belongs in the Evidence section?",
o:["A clear opening statement that answers the question in one simple sentence.","Specific facts, dates or examples that prove your point, such as the Bowring Treaty.","A final sentence that links your argument back to the wording of the question.","A general description of the topic that sets the scene before your argument."],a:1,
h:"This is the part that proves your point is true.",
expl:"Evidence means specific facts and examples that prove your point. A is the Point, C is the Link.",
insight:"Evidence = specific contextual knowledge (facts, dates, examples) proving the point."},
{t:"Key Concepts",q:"According to the Question B markscheme, what earns the full 6 marks?",
o:["One reason, explained in detail and supported by several specific examples.","Four separate points, each identified and briefly described in one sentence.","Two reasons, each identified clearly but described without further explanation.","Two reasons, each one explained and supported by specific contextual knowledge."],a:3,
h:"Level 4 needs more than one reason, and each must be explained.",
expl:"Level 4 (6 marks) = explains two reasons. One explained reason gets 4-5 marks; identifying without explaining gets 2-3.",
insight:"Level 4 (6 marks): explains two reasons; Level 3 (4-5): explains one reason, 5 if supported by specific contextual knowledge."},
{t:"Key Concepts",q:"When judging the reliability of a source, what does 'provenance' refer to?",
o:["What the source shows, including the people, objects and actions that appear in it.","How the source's message compares with a second source on the same topic.","Who made the source, when it was made, and why it was created.","Which facts from your own knowledge support the main message of the source."],a:2,
h:"Think: author, date, purpose.",
expl:"Provenance is the origin of a source: who made it, when, and why. It is key to judging reliability.",
insight:"Reliability Level 4: use own/contextual knowledge AND provenance, discussing BOTH sides of reliability."},

// ===================== SCRAMBLE FOR AFRICA (10) =====================
{t:"Scramble for Africa",q:"What is imperialism?",
o:["A policy of keeping a country closed to foreign trade in order to protect local culture.","A policy of extending a country's power and influence through diplomacy or military force.","A policy of sharing all of a country's land and resources equally among its citizens.","A policy of building factories so that industry replaces farming as the main source of work."],a:1,
h:"It is about a country spreading its power beyond its borders.",
expl:"Imperialism is a policy of extending a country's power and influence through diplomacy or military force.",
insight:"Imperialism = a policy of extending a country's power and influence through diplomacy or military force."},
{t:"Scramble for Africa",q:"For most of the 19th century, European control in Africa was mostly limited to...",
o:["Inland plantations","Desert oases","Coastal ports","Mountain forts"],a:2,
h:"Under 'old imperialism', Europeans stayed near the sea.",
expl:"Before New Imperialism, European power in Africa was mostly coastal trading ports.",
insight:"Old imperialism: European empires were limited to coastal power; focus on cash crops and raw materials."},
{t:"Scramble for Africa",q:"What allowed Europeans to move from the coast into the interior of Africa?",

insight:"Bowring Treaty (1855)."},
{t:"Key Dates",q:"In which year was the Treaty of Nanking signed, ending the First Opium War?",
o:["1823","1834","1842","1856"],a:2,
h:"The First Opium War ran 1839 to this year.",
expl:"The First Opium War (1839-42) ended with the Treaty of Nanking in 1842.",
insight:"Treaty of Nanking, 1842: first of many treaties which led to decreased Chinese power."}
];
if (typeof module !== "undefined") module.exports = BANK;

</script>
<script>
(function(){
"use strict";
var VERSION="ver1.00";
var QUIZ_NAME="G8 History MYS Quiz";
var QS_PER_ROUND=12;
var STREAK_TO_MASTER=2;
var FINAL_PASS_SPACING_MS=5*60*1000;
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
var LS_KEY=slugify(QUIZ_NAME)+"_v1";

BANK.forEach(function(q,i){q.id=i;});

var TOPIC_COLORS=["#3949ab","#00897b","#8e24aa","#d81b60","#c62828","#2e7d32","#6d4c41","#0277bd","#ef6c00","#546e7a"];
var topics=[];BANK.forEach(function(q){if(topics.indexOf(q.t)<0)topics.push(q.t);});
var colorOf={};topics.forEach(function(t,i){colorOf[t]=TOPIC_COLORS[i%TOPIC_COLORS.length];});

var $=function(id){return document.getElementById(id);};

/* ---------- storage ---------- */
var store=null;try{store=window.localStorage;}catch(e){store=null;}
function freshState(){var s={ledger:{}};BANK.forEach(function(q){s.ledger[q.id]={streak:0,status:"active",lastCorrect:0};});return s;}
function loadState(){
  var s=null;
  try{var raw=store?store.getItem(LS_KEY):null;if(raw)s=JSON.parse(raw);}catch(e){s=null;}
  if(!s||typeof s!=="object"||!s.ledger||typeof s.ledger!=="object")s=freshState();
  BANK.forEach(function(q){
    var l=s.ledger[q.id];
    if(!l||typeof l!=="object")s.ledger[q.id]={streak:0,status:"active",lastCorrect:0};
    else{l.streak=+l.streak||0;l.lastCorrect=+l.lastCorrect||0;l.status=(l.status==="mastered")?"mastered":"active";}
  });
  return s;
}
function saveState(){try{if(store)store.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
var state=loadState();

/* ---------- helpers ---------- */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function L(q){return state.ledger[q.id];}
function isFinalPass(q){var l=L(q);return l.status==="active"&&l.streak===STREAK_TO_MASTER-1;}
function isEligible(q,now){
  var l=L(q);if(l.status!=="active")return false;
  if(l.streak===STREAK_TO_MASTER-1&&FINAL_PASS_SPACING_MS>0)return (now-l.lastCorrect)>=FINAL_PASS_SPACING_MS;
  return true;
}
function resting(now){return BANK.filter(function(q){var l=L(q);return l.status==="active"&&!isEligible(q,now);});}
function mins(ms){return Math.max(1,Math.ceil(ms/60000));}
function show(id){["home","quiz","results"].forEach(function(s){$(s).classList.toggle("on",s===id);});$("nextBar").style.display="none";window.scrollTo(0,0);}

/* ---------- home ---------- */
function renderHome(){
  $("ver").textContent=VERSION;
  $("title").textContent=QUIZ_NAME;
  var pills=$("pills");pills.innerHTML="";
  topics.forEach(function(t){var p=document.createElement("span");p.className="pill";p.textContent=t;p.style.borderColor=colorOf[t];p.style.color=colorOf[t];pills.appendChild(p);});
  var total=BANK.length,done=BANK.filter(function(q){return L(q).status==="mastered";}).length;
  $("sActive").textContent=total-done;$("sDone").textContent=done;
  $("how").textContent="Answer correctly "+STREAK_TO_MASTER+" times in a row to complete a question. A wrong answer resets your progress on that question. Work through all "+total+" questions to finish.";
  var now=Date.now(),rest=resting(now),elig=BANK.filter(function(q){return isEligible(q,now);}).length;
  var note=$("restNote");
  if(done===total){note.style.display="block";note.textContent="🎉 All "+total+" questions completed. Great work!";}
  else if(rest.length){
    var soon=Math.min.apply(null,rest.map(function(q){return FINAL_PASS_SPACING_MS-(now-L(q).lastCorrect);}));
    note.style.display="block";
    note.textContent=rest.length+" question"+(rest.length>1?"s are":" is")+" resting before a final try (next one ready in about "+mins(soon)+" min)."+(elig<QS_PER_ROUND&&elig>0?" The next round will be shorter: "+elig+" question"+(elig>1?"s":"")+".":"");
  } else note.style.display="none";
  $("btnGo").disabled=(done===total);
  var box=$("topics");box.innerHTML="";box.classList.toggle("two",topics.length>=7);
  var bars=[];
  topics.forEach(function(t){
    var qs=BANK.filter(function(q){return q.t===t;});
    var m=qs.filter(function(q){return L(q).status==="mastered";}).length;
    var half=qs.filter(function(q){var l=L(q);return l.status==="active"&&l.streak>0;}).length;
    var c=document.createElement("div");c.className="tcard";
    var n=document.createElement("div");n.className="tname";n.style.color=colorOf[t];n.textContent=t;
    var meta=document.createElement("div");meta.className="tmeta";
    var h=document.createElement("span");
    if(half>0){h.className="half";h.textContent="▶"+half;h.title="One more correct answer to complete these";}
    var cnt=document.createElement("span");cnt.textContent=m+"/"+qs.length;
    meta.appendChild(h);meta.appendChild(cnt);
    var bar=document.createElement("div");bar.className="bar";var fill=document.createElement("i");fill.style.background=colorOf[t];bar.appendChild(fill);
    c.appendChild(n);c.appendChild(meta);c.appendChild(bar);box.appendChild(c);
    bars.push([fill,qs.length?100*m/qs.length:0]);
  });
  bars.push([$("mainBar"),100*done/total]);
  bars.forEach(function(b){b[0].style.width="0";});
  requestAnimationFrame(function(){requestAnimationFrame(function(){bars.forEach(function(b){b[0].style.width=b[1]+"%";});});});
  show("home");
}

/* ---------- session ---------- */
var session=null;
function startSession(includeResting){
  var now=Date.now();
  var elig=shuffle(BANK.filter(function(q){return isEligible(q,now);}));
  // put questions the student has never got right / got wrong before the others
  elig.sort(function(a,b){return L(a).streak-L(b).streak;});
  elig=shuffle(elig.slice(0,QS_PER_ROUND));
  if(includeResting&&elig.length<QS_PER_ROUND){
    var r=resting(now).sort(function(a,b){return L(a).lastCorrect-L(b).lastCorrect;});
    elig=elig.concat(r.slice(0,QS_PER_ROUND-elig.length));
  }
  if(!elig.length)return;
  session={qs:elig,i:0,correct:0,completed:0,per:{}};
  renderQ();
}
function onContinue(){
  var now=Date.now();
  var elig=BANK.filter(function(q){return isEligible(q,now);}).length;
  var rest=resting(now);
  if(elig>0){startSession(false);return;}
  if(rest.length){
    var soon=Math.min.apply(null,rest.map(function(q){return FINAL_PASS_SPACING_MS-(now-L(q).lastCorrect);}));
    $("restText").textContent="Your remaining "+rest.length+" question"+(rest.length>1?"s are":" is")+" resting before a final try. The next one is ready in about "+mins(soon)+" min. Wait for best results, or review them now.";
    $("restModal").classList.add("on");
  }
}

var answered=false;
function renderQ(){
  show("quiz");answered=false;
  var q=session.qs[session.i];
  var b=$("qBadge");b.textContent=q.t;b.style.borderColor=colorOf[q.t];b.style.color=colorOf[q.t];
  $("qNum").textContent="Q "+(session.i+1)+" of "+session.qs.length;
  $("qText").textContent=q.q;
  var hb=$("hintBtn"),hx=$("hintBox");hx.style.display="none";hx.textContent=q.h;
  if(isFinalPass(q)){hb.disabled=true;hb.textContent="💡 Hint off: final try for this question";}
  else{hb.disabled=false;hb.textContent="💡 Show hint";}
  var box=$("opts");box.innerHTML="";
  shuffle([0,1,2,3]).forEach(function(idx){
    var o=document.createElement("button");o.className="opt";o.textContent=q.o[idx];o.dataset.idx=idx;
    o.addEventListener("click",function(){pick(idx);});box.appendChild(o);
  });
  $("expl").style.display="none";$("insight").style.display="none";$("nextBar").style.display="none";
  window.scrollTo(0,0);
}
function pick(idx){
  if(answered)return;answered=true;
  var q=session.qs[session.i],l=L(q),ok=(idx===q.a);
  var per=session.per[q.t]||(session.per[q.t]={c:0,d:0});per.d++;
  if(ok){
    l.streak++;l.lastCorrect=Date.now();session.correct++;per.c++;
    if(l.streak>=STREAK_TO_MASTER){l.status="mastered";session.completed++;}
  } else {l.streak=0;}
  saveState();
  Array.prototype.forEach.call($("opts").children,function(b){
    var i=+b.dataset.idx;b.disabled=true;
    if(i===q.a)b.classList.add("ok");else if(i===idx)b.classList.add("bad");
  });
  var v=$("verdict");v.textContent=ok?"✓ Correct":"✗ Not quite";v.style.color=ok?"#2e7d32":"#c62828";
  $("explText").textContent=q.expl;$("expl").style.display="block";
  $("insightText").textContent=q.insight;$("insight").style.display="block";
  $("btnNext").textContent=(session.i===session.qs.length-1)?"See results →":"Next →";
  $("nextBar").style.display="block";
}
function next(){session.i++;if(session.i>=session.qs.length)renderResults();else renderQ();}

function renderResults(){
  show("results");
  $("rScore").textContent=session.correct+" / "+session.qs.length;
  var rb=$("rBadge");
  if(session.completed>0){rb.style.display="block";rb.textContent="+ "+session.completed+" question"+(session.completed>1?"s":"")+" completed this session";}
  else rb.style.display="none";
  var tb=$("rTable");tb.innerHTML="";
  topics.forEach(function(t){
    var p=session.per[t];if(!p)return;
    var tr=document.createElement("tr");
    var a=document.createElement("td");a.textContent=t;a.style.color=colorOf[t];a.style.fontWeight="600";
    var b=document.createElement("td");b.className="n";b.textContent=p.c;
    var c=document.createElement("td");c.className="n";c.textContent=p.d;
    tr.appendChild(a);tr.appendChild(b);tr.appendChild(c);tb.appendChild(tr);
  });
}

/* ---------- events ---------- */
$("btnGo").addEventListener("click",onContinue);
$("btnReset").addEventListener("click",function(){$("resetModal").classList.add("on");});
$("mCancel").addEventListener("click",function(){$("resetModal").classList.remove("on");});
$("mConfirm").addEventListener("click",function(){
  try{if(store)store.removeItem(LS_KEY);}catch(e){}
  state=freshState();$("resetModal").classList.remove("on");renderHome();
});
$("rCancel").addEventListener("click",function(){$("restModal").classList.remove("on");});
$("rGo").addEventListener("click",function(){$("restModal").classList.remove("on");startSession(true);});
$("hintBtn").addEventListener("click",function(){if(this.disabled)return;var h=$("hintBox");h.style.display=(h.style.display==="block")?"none":"block";});
$("btnNext").addEventListener("click",next);
$("btnBack").addEventListener("click",renderHome);
$("qHome").addEventListener("click",renderHome);

renderHome();
})();
</script>
</body>
</html>
