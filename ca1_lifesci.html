<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CA1 Science: Nutrition &amp; Digestion Quiz</title>
<style>
  :root{
    --navy:#1a1a2e; --bg:#f5f6fa; --text:#1a1a2e; --muted:#5f6475;
    --green:#2e7d32; --green-bg:#e8f5e9; --red:#c62828; --red-bg:#ffebee;
    --orange:#f57c00; --card-shadow:0 2px 8px rgba(0,0,0,.08); --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text)}
  body{font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
  .app{max-width:600px;margin:0 auto;padding:16px 16px 110px}
  .hidden{display:none!important}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);padding:18px}

  /* Home */
  .home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:4px 0 12px}
  h1{font-size:1.55rem;font-weight:800;line-height:1.2}
  .version{font-size:.75rem;color:var(--muted);white-space:nowrap;padding-top:6px}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .pill{background:#fff;border:1.5px solid;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600}
  .stats{display:flex;gap:12px;margin-bottom:14px}
  .stat{flex:1;text-align:center}
  .stat .num{font-size:2.1rem;font-weight:800;line-height:1.1}
  .stat .lbl{font-size:.8rem;color:var(--muted)}
  .bar{height:10px;background:#e7e9f0;border-radius:999px;overflow:hidden}
  .bar>span{display:block;height:100%;width:0;border-radius:999px;transition:width .8s ease}
  .bar.main>span{background:var(--navy)}
  .pct{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px}
  .how{font-size:.88rem;color:var(--muted);margin-top:12px}
  .notice{margin-top:12px;font-size:.88rem;background:#fff8e1;border:1px solid #ffe0a3;border-radius:8px;padding:10px 12px}
  .notice.done{background:var(--green-bg);border-color:#b9dfbb}
  .btn{display:block;width:100%;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .15s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-outline{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .btn-link{background:none;color:var(--navy);text-decoration:underline;font-weight:600;padding:8px;font-size:.9rem}
  .btns{display:grid;gap:10px;margin:16px 0}
  .topics{display:grid;gap:10px}
  .topics.two{grid-template-columns:1fr 1fr}
  .tcard{background:#fff;border-radius:10px;box-shadow:var(--card-shadow);padding:10px 11px;min-width:0}
  .tname{font-weight:700;font-size:.85rem;line-height:1.25;margin-bottom:6px;overflow-wrap:anywhere}
  .trow{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);margin-bottom:6px;gap:4px}
  .half{color:var(--orange);font-weight:700;cursor:help}
  .tcard .bar{height:7px}

  /* Quiz */
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
  .badge{border:1.5px solid;background:#fff;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700}
  .qcount{font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
  .qtext{font-size:1.2rem;font-weight:700;text-align:center;margin:6px 0 14px}
  .hint-btn{background:#fff;border:1.5px dashed #9aa0b4;color:var(--navy);border-radius:10px;padding:9px 12px;width:100%;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;text-align:left}
  .hint-btn:disabled{background:#eceef3;color:#9aa0b4;border-color:#d3d6df;cursor:not-allowed}
  .hint-body{margin-top:6px;background:#f3f5ff;border-radius:8px;padding:10px 12px;font-size:.9rem}
  .opts{display:grid;gap:10px;margin:14px 0}
  .opt{background:#fff;border:1.5px solid #d9dce5;border-radius:10px;padding:13px 14px;font-size:.98rem;text-align:left;cursor:pointer;font-family:inherit;color:var(--text);transition:background .15s,border-color .15s,color .15s;box-shadow:var(--card-shadow)}
  .opt:hover:not(:disabled){border-color:var(--navy)}
  .opt:disabled{cursor:default}
  .opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:700}
  .opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red);font-weight:700}
  .opt.dim{opacity:.6}
  .verdict{font-weight:800;margin-bottom:6px}
  .verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
  .expl{margin-top:4px;font-size:.93rem}
  .insight{margin-top:12px;border:1.5px solid #c5cae9;background:#f5f6ff;border-radius:10px;padding:12px;font-size:.92rem}
  .insight b{display:block;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:#3949ab;margin-bottom:4px}
  .nextbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(245,246,250,0))}
  .nextbar .btn{max-width:568px;margin:0 auto}
  .quit{display:block;margin:4px auto 0}

  /* Results */
  .score{font-size:2.6rem;font-weight:800;text-align:center}
  .score-lbl{text-align:center;color:var(--muted);margin-bottom:10px}
  .done-badge{display:block;width:max-content;max-width:100%;margin:0 auto 14px;background:var(--green-bg);color:var(--green);font-weight:700;border-radius:999px;padding:6px 14px;font-size:.9rem}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{padding:8px 6px;border-bottom:1px solid #eceef3;text-align:left}
  th{color:var(--muted);font-weight:600;font-size:.78rem}
  td.n,th.n{text-align:center}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(26,26,46,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal .card{max-width:380px;width:100%;text-align:center}
  .modal h2{font-size:1.15rem;margin-bottom:8px}
  .modal p{color:var(--muted);margin-bottom:16px}
  .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn-grey{background:#eceef3;color:var(--text)}
  .btn-red{background:var(--red);color:#fff}
  @media (min-width:600px){ h1{font-size:1.8rem} .qtext{font-size:1.3rem} }
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section id="home">
    <div class="home-top">
      <h1 id="quizTitle"></h1>
      <span class="version" id="version"></span>
    </div>
    <div class="pills" id="pills"></div>

    <div class="card">
      <div class="stats">
        <div class="stat"><div class="num" id="activeNum">0</div><div class="lbl">Active Questions</div></div>
        <div class="stat"><div class="num" id="doneNum">0</div><div class="lbl">Completed</div></div>
      </div>
      <div class="bar main"><span id="mainBar"></span></div>
      <div class="pct" id="mainPct"></div>
      <p class="how" id="howText"></p>
      <div class="notice hidden" id="notice"></div>
    </div>

    <div class="btns">
      <button class="btn btn-primary" id="continueBtn">▶ Continue Progress</button>
      <button class="btn btn-link hidden" id="anywayBtn">Practise the resting questions now anyway</button>
      <button class="btn btn-outline" id="resetBtn">↺ Start All Over</button>
    </div>

    <div class="topics" id="topics"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qhead">
      <span class="badge" id="qBadge"></span>
      <span class="qcount" id="qCount"></span>
    </div>
    <div class="card">
      <p class="qtext" id="qText"></p>
      <button class="hint-btn" id="hintBtn">💡 Show hint</button>
      <div class="hint-body hidden" id="hintBody"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="card hidden" id="feedback">
      <div class="verdict" id="verdict"></div>
      <div class="expl" id="expl"></div>
      <div class="insight"><b>Key point</b><span id="insight"></span></div>
    </div>
    <button class="btn btn-link quit" id="quitBtn">Back to home</button>
    <div class="nextbar hidden" id="nextBar"><button class="btn btn-primary" id="nextBtn">Next →</button></div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card">
      <div class="score" id="score"></div>
      <div class="score-lbl">correct this round</div>
      <span class="done-badge hidden" id="doneBadge"></span>
      <table>
        <thead><tr><th>Topic</th><th class="n">Correct</th><th class="n">Drawn this session</th></tr></thead>
        <tbody id="resTable"></tbody>
      </table>
    </div>
    <div class="btns"><button class="btn btn-primary" id="backBtn">Continue Studying →</button></div>
  </section>
</div>

<!-- RESET MODAL -->
<div class="modal hidden" id="modal">
  <div class="card">
    <h2>Start all over?</h2>
    <p>This will erase all your progress. Are you sure?</p>
    <div class="row">
      <button class="btn btn-grey" id="cancelBtn">Cancel</button>
      <button class="btn btn-red" id="confirmBtn">Confirm</button>
    </div>
  </div>
</div>

(function(){
  "use strict";
  // ---------- Config ----------
  var QUIZ_NAME = "CA1 Science: Nutrition & Digestion Quiz";
  var VERSION = "ver1.00";
  var QS_PER_ROUND = 16;
  var STREAK_TO_MASTER = 2;
  var FINAL_PASS_SPACING_MS = 5 * 60 * 1000;   // 5 min
  function slugify(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""); }
  var LS_KEY = slugify(QUIZ_NAME) + "_v1";

  BANK.forEach(function(q,i){ q.id = i; });
  var TOPICS = [];
  BANK.forEach(function(q){ if (TOPICS.indexOf(q.t) === -1) TOPICS.push(q.t); });
  var PALETTE = ["#1e88e5","#8e24aa","#d81b60","#00897b","#6d4c41","#b7860b","#455a64","#3949ab","#00838f","#ad1457"];
  function colorOf(t){ return PALETTE[TOPICS.indexOf(t) % PALETTE.length]; }

  // ---------- State / storage ----------
  var memoryStore = null; // fallback if localStorage is unavailable
  function freshState(){
    var ledger = {};
    BANK.forEach(function(q){ ledger[q.id] = { streak:0, status:"active", lastCorrect:0 }; });
    return { ledger: ledger };
  }
  function loadState(){
    var raw = null;
    try { raw = window.localStorage.getItem(LS_KEY); } catch(e){ raw = memoryStore; }
    var st = null;
    try { st = raw ? JSON.parse(raw) : null; } catch(e){ st = null; }
    if (!st || typeof st !== "object" || !st.ledger || typeof st.ledger !== "object") st = freshState();
    // repair / fill any missing entries (e.g. after bank changes)
    BANK.forEach(function(q){
      var e = st.ledger[q.id];
      if (!e || typeof e !== "object") { st.ledger[q.id] = { streak:0, status:"active", lastCorrect:0 }; return; }
      if (typeof e.streak !== "number" || e.streak < 0) e.streak = 0;
      if (e.status !== "active" && e.status !== "mastered") e.status = "active";
      if (typeof e.lastCorrect !== "number") e.lastCorrect = 0;
    });
    return st;
  }
  function saveState(){
    var raw = JSON.stringify(state);
    try { window.localStorage.setItem(LS_KEY, raw); } catch(e){ memoryStore = raw; }
  }
  function clearState(){
    try { window.localStorage.removeItem(LS_KEY); } catch(e){}
    memoryStore = null;
  }
  var state = loadState();

  // ---------- Helpers ----------
  function $(id){ return document.getElementById(id); }
  function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function show(id){ ["home","quiz","results"].forEach(function(s){ $(s).classList.toggle("hidden", s!==id); }); window.scrollTo(0,0); }
  function isFinalPass(e){ return e.status === "active" && e.streak === STREAK_TO_MASTER - 1; }
  function isEligible(e, now){
    if (e.status !== "active") return false;
    if (isFinalPass(e) && FINAL_PASS_SPACING_MS > 0) return (now - e.lastCorrect) >= FINAL_PASS_SPACING_MS;
    return true;
  }
  function fmtWait(ms){
    var m = Math.ceil(ms/60000);
    if (m < 60) return m + (m===1?" minute":" minutes");
    var h = Math.ceil(m/60); if (h < 48) return h + " hours";
    return Math.ceil(h/24) + " days";
  }

  // ---------- Home ----------
  var noticeTimer = null;
  function renderHome(){
    $("quizTitle").textContent = QUIZ_NAME;
    $("version").textContent = VERSION;
    var now = Date.now(), total = BANK.length, mastered = 0, eligible = 0, resting = [], perTopic = {};
    TOPICS.forEach(function(t){ perTopic[t] = { total:0, mastered:0, half:0 }; });
    BANK.forEach(function(q){
      var e = state.ledger[q.id], pt = perTopic[q.t];
      pt.total++;
      if (e.status === "mastered"){ mastered++; pt.mastered++; }
      else {
        if (e.streak >= 1) pt.half++;
        if (isEligible(e, now)) eligible++; else resting.push(e);
      }
    });
    var active = total - mastered, pct = total ? Math.round(mastered/total*100) : 0;
    $("activeNum").textContent = active;
    $("doneNum").textContent = mastered;
    $("mainPct").textContent = pct + "% complete";
    $("howText").textContent = "Answer correctly " + STREAK_TO_MASTER + " times in a row to complete a question. A wrong answer resets your progress on that question. Work through all " + total + " questions to finish.";

    // pills
    var pills = $("pills"); pills.innerHTML = "";
    TOPICS.forEach(function(t){ var p = el("span","pill",t); p.style.borderColor = colorOf(t); p.style.color = colorOf(t); pills.appendChild(p); });

    // topic cards
    var box = $("topics"); box.innerHTML = "";
    box.classList.toggle("two", TOPICS.length >= 7);
    TOPICS.forEach(function(t){
      var pt = perTopic[t], c = colorOf(t);
      var card = el("div","tcard");
      var name = el("div","tname",t); name.style.color = c; card.appendChild(name);
      var row = el("div","trow");
      var left = el("span");
      if (pt.half > 0){ var h = el("span","half","▶" + pt.half); h.title = "One more correct answer to complete these"; left.appendChild(h); }
      row.appendChild(left);
      row.appendChild(el("span",null, pt.mastered + "/" + pt.total));
      card.appendChild(row);
      var bar = el("div","bar"), fill = el("span"); fill.style.background = c; fill.dataset.w = (pt.total ? pt.mastered/pt.total*100 : 0) + "%";
      bar.appendChild(fill); card.appendChild(bar); box.appendChild(card);
    });

    // notice / relief valve
    var notice = $("notice"), cont = $("continueBtn"), anyway = $("anywayBtn");
    notice.className = "notice hidden"; anyway.classList.add("hidden"); cont.disabled = false;
    if (noticeTimer){ clearTimeout(noticeTimer); noticeTimer = null; }
    if (active === 0){
      notice.textContent = "🎉 Amazing — you have completed all " + total + " questions! Press “Start All Over” if you want to practise again.";
      notice.className = "notice done"; cont.disabled = true;
    } else if (eligible === 0){
      var soonest = Math.min.apply(null, resting.map(function(e){ return FINAL_PASS_SPACING_MS - (now - e.lastCorrect); }));
      notice.textContent = "The remaining " + resting.length + " question" + (resting.length===1?" is":"s are") + " resting before their final check. Come back in about " + fmtWait(soonest) + ", or practise them now.";
      notice.classList.remove("hidden"); cont.disabled = true; anyway.classList.remove("hidden");
      noticeTimer = setTimeout(renderHome, Math.min(Math.max(soonest,1000), 60000));
    } else if (eligible < QS_PER_ROUND && resting.length > 0){
      notice.textContent = "The next round will be shorter (" + eligible + " question" + (eligible===1?"":"s") + ") while " + resting.length + " other" + (resting.length===1?" rests":"s rest") + " before a final check.";
      notice.classList.remove("hidden");
    }

    // animate bars
    $("mainBar").style.width = "0";
    box.querySelectorAll(".bar>span").forEach(function(s){ s.style.width = "0"; });
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      $("mainBar").style.width = pct + "%";
      box.querySelectorAll(".bar>span").forEach(function(s){ s.style.width = s.dataset.w; });
    }); });
    show("home");
  }

  // ---------- Session ----------
  var session = null;
  function startSession(ignoreSpacing){
    var now = Date.now();
    var pool = BANK.filter(function(q){
      var e = state.ledger[q.id];
      return ignoreSpacing ? e.status === "active" : isEligible(e, now);
    });
    if (!pool.length){ renderHome(); return; }
    var draw = shuffle(pool).slice(0, QS_PER_ROUND);
    session = { items: draw.map(function(q){ return { q:q, finalPass: isFinalPass(state.ledger[q.id]) }; }), idx:0, correct:0, completed:0, perTopic:{} };
    renderQuestion();
    show("quiz");
  }

  function renderQuestion(){
    var it = session.items[session.idx], q = it.q, c = colorOf(q.t);
    $("qBadge").textContent = q.t; $("qBadge").style.borderColor = c; $("qBadge").style.color = c;
    $("qCount").textContent = "Q " + (session.idx+1) + " of " + session.items.length;
    $("qText").textContent = q.q;
    var hb = $("hintBtn"), hbody = $("hintBody");
    hbody.classList.add("hidden"); hbody.textContent = q.h;
    if (it.finalPass){ hb.disabled = true; hb.textContent = "💡 Hint not available on the final check"; }
    else { hb.disabled = false; hb.textContent = "💡 Show hint"; }
    var opts = $("opts"); opts.innerHTML = "";
    shuffle(q.o.map(function(text,i){ return { text:text, i:i }; })).forEach(function(o){
      var b = el("button","opt",o.text); b.dataset.i = o.i;
      b.addEventListener("click", function(){ answer(o.i, b); });
      opts.appendChild(b);
    });
    $("feedback").classList.add("hidden");
    $("nextBar").classList.add("hidden");
    window.scrollTo(0,0);
  }

  function answer(choice, btn){
    var it = session.items[session.idx], q = it.q, e = state.ledger[q.id];
    var ok = choice === q.a;
    // update ledger & save immediately
    if (ok){
      e.streak++; e.lastCorrect = Date.now();
      if (e.streak >= STREAK_TO_MASTER){ e.status = "mastered"; session.completed++; }
      session.correct++;
    } else {
      e.streak = 0;
    }
    saveState();
    var pt = session.perTopic[q.t] || (session.perTopic[q.t] = { correct:0, drawn:0 });
    pt.drawn++; if (ok) pt.correct++;

    // UI
    $("opts").querySelectorAll(".opt").forEach(function(b){
      b.disabled = true;
      var i = +b.dataset.i;
      if (i === q.a) b.classList.add("correct");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    $("hintBtn").disabled = true;
    var v = $("verdict");
    v.className = "verdict " + (ok ? "ok" : "no");
    v.textContent = ok ? (e.status === "mastered" ? "✓ Correct — question completed!" : "✓ Correct!") : "✗ Not quite.";
    $("expl").textContent = q.expl;
    $("insight").textContent = q.insight;
    $("feedback").classList.remove("hidden");
    $("nextBtn").textContent = session.idx === session.items.length - 1 ? "See results →" : "Next →";
    $("nextBar").classList.remove("hidden");
  }

  function next(){
    session.idx++;
    if (session.idx >= session.items.length) renderResults();
    else renderQuestion();
  }

  function renderResults(){
    $("score").textContent = session.correct + " / " + session.items.length;
    var db = $("doneBadge");
    if (session.completed > 0){ db.textContent = "+ " + session.completed + " question" + (session.completed===1?"":"s") + " completed this session"; db.classList.remove("hidden"); }
    else db.classList.add("hidden");
    var tb = $("resTable"); tb.innerHTML = "";
    TOPICS.forEach(function(t){
      var pt = session.perTopic[t]; if (!pt) return;
      var tr = el("tr"), td = el("td",null,t); td.style.color = colorOf(t); td.style.fontWeight = "600";
      tr.appendChild(td); tr.appendChild(el("td","n",String(pt.correct))); tr.appendChild(el("td","n",String(pt.drawn)));
      tb.appendChild(tr);
    });
    $("nextBar").classList.add("hidden");
    show("results");
  }

  // ---------- Events ----------
  $("continueBtn").addEventListener("click", function(){ startSession(false); });
  $("anywayBtn").addEventListener("click", function(){ startSession(true); });
  $("nextBtn").addEventListener("click", next);
  $("backBtn").addEventListener("click", renderHome);
  $("quitBtn").addEventListener("click", function(){ $("nextBar").classList.add("hidden"); renderHome(); });
  $("hintBtn").addEventListener("click", function(){
    if (this.disabled) return;
    var hb = $("hintBody"), open = hb.classList.toggle("hidden") === false;
    this.textContent = open ? "💡 Hide hint" : "💡 Show hint";
  });
  $("resetBtn").addEventListener("click", function(){ $("modal").classList.remove("hidden"); });
  $("cancelBtn").addEventListener("click", function(){ $("modal").classList.add("hidden"); });
  $("confirmBtn").addEventListener("click", function(){
    clearState(); state = freshState(); saveState();
    $("modal").classList.add("hidden"); renderHome();
  });

  renderHome();
})();
</script>
