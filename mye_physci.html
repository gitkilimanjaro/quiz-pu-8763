  {"t":"Refraction & Dispersion","q":"How can the spectrum from a prism be recombined to give white light again?","o":["Using a second, identical filter","Using a second, inverted prism","Using a plane mirror only","Using a frosted glass block"],"a":1,"h":"You need something that bends each colour back by the same amount.","expl":"A second prism placed upside down bends the colours back together to form white light. A spinning Newton's disc also shows that the colours combine into white.","insight":"The spectrum can be recombined into white light using a second inverted prism."},
  {"t":"Coloured Light","q":"What are the primary colours of light?","o":["Cyan, magenta and yellow","Red, yellow and blue","Red, green and yellow","Red, green and blue"],"a":3,"h":"They are not the same as the primary colours of paint.","expl":"The primary colours of light are red, green and blue. Cyan, magenta and yellow are the secondary colours of light.","insight":"Primary colours of light: red, green, blue. Secondary colours: cyan, magenta, yellow."},
  {"t":"Coloured Light","q":"Which colour is produced when red light and green light overlap?","o":["Cyan","White","Yellow","Magenta"],"a":2,"h":"It is a secondary colour of light.","expl":"Red + green = yellow. Red + blue = magenta. Blue + green = cyan.","insight":"Red + green = yellow."},
  {"t":"Coloured Light","q":"Which two colours of light combine to produce magenta light?","o":["Green and yellow","Red and green","Blue and green","Red and blue"],"a":3,"h":"Magenta is the secondary colour that contains no green.","expl":"Red + blue = magenta. Red + green = yellow and blue + green = cyan.","insight":"Red + blue = magenta. Blue + green = cyan."},
  {"t":"Coloured Light","q":"Which colour is produced when red, green and blue light all overlap?","o":["Grey","Black","Brown","White"],"a":3,"h":"This is colour addition, not mixing paint.","expl":"Adding all three primary colours of light together produces white light.","insight":"Red + green + blue = white light."},
  {"t":"Coloured Light","q":"White light shines on a red filter. What does the filter do?","o":["It absorbs red light and transmits green and blue light","It reflects red light and transmits green and blue light","It transmits red light and absorbs green and blue light","It adds red colour to all the light passing through"],"a":2,"h":"Filters only take colours away. They never add colour.","expl":"A red filter lets red light pass through (transmits it) and absorbs the other colours. Filters subtract colours and do not add any.","insight":"A coloured filter transmits light of its own colour and absorbs the other colours."},
  {"t":"Coloured Light","q":"White light passes through a red filter and then through a green filter. What is seen after the second filter?","o":["Yellow light","Red light","White light","No light"],"a":3,"h":"Work out what leaves the first filter, then what the second filter does to it.","expl":"Only red light leaves the red filter. The green filter absorbs red light, so no light gets through.","insight":"A green filter absorbs red light, so red light cannot pass through a green filter."},
  {"t":"Coloured Light","q":"Why does a red object look red in white light?","o":["It reflects red light and absorbs the other colours","It absorbs red light and reflects the other colours","It transmits red light and reflects the other colours","It reflects all colours but the red light reaches us first"],"a":0,"h":"We see the colour of the light that reaches our eyes.","expl":"A red object reflects the red part of white light into our eyes and absorbs all the other colours.","insight":"A coloured object reflects light of its own colour and absorbs the other colours."},
  {"t":"Coloured Light","q":"What colour does a red object appear in blue light?","o":["Black","Magenta","Red","Blue"],"a":0,"h":"Is there any red light available for the object to reflect?","expl":"A red object can only reflect red light. Blue light is absorbed, so no light is reflected and the object looks black.","insight":"An object looks black when it absorbs all the light falling on it and reflects none."},
  {"t":"Coloured Light","q":"What colour does a green leaf appear in yellow light?","o":["Red","Yellow","Black","Green"],"a":3,"h":"Yellow light is a mixture of two primary colours.","expl":"Yellow light is red + green. The leaf absorbs the red part and reflects the green part, so it looks green.","insight":"Yellow light = red + green. A green object reflects the green part and absorbs the red part."},
  {"t":"Coloured Light","q":"Why does a black object look black in white light?","o":["It absorbs all colours of light and reflects none","It absorbs only the three primary colours of light","It reflects all colours of light and absorbs none","It transmits all colours of light straight through itself"],"a":0,"h":"Black is what we see when no light reaches our eyes from an object.","expl":"A black object absorbs all the colours of light falling on it and reflects none. A white object reflects all colours.","insight":"Black objects absorb all colours and reflect none; white objects reflect all colours."}
];
BANK.forEach((q, i) => q.id = i);

const TOPIC_COLORS = ["#1565c0","#00897b","#6a1b9a","#9c6b00","#880e4f","#455a64","#bf360c","#795548","#558b2f","#3949ab","#0097a7","#d81b60"];
const TOPICS = [];
BANK.forEach(q => { if (!TOPICS.includes(q.t)) TOPICS.push(q.t); });
const colorOf = t => TOPIC_COLORS[TOPICS.indexOf(t) % TOPIC_COLORS.length];

/* ================= STORAGE ================= */
let memoryStore = null;
function freshState() {
  const ledger = {};
  BANK.forEach(q => ledger[q.id] = { streak: 0, status: "active", lastCorrect: 0 });
  return { ledger };
}
function loadState() {
  let raw = null;
  try { raw = (typeof localStorage !== "undefined") ? localStorage.getItem(LS_KEY) : memoryStore; }
  catch (e) { raw = memoryStore; }
  let st = null;
  if (raw) { try { st = JSON.parse(raw); } catch (e) { st = null; } }
  if (!st || typeof st !== "object" || !st.ledger || typeof st.ledger !== "object") st = freshState();
  BANK.forEach(q => {
    const e = st.ledger[q.id];
    if (!e || typeof e !== "object" || typeof e.streak !== "number" || (e.status !== "active" && e.status !== "mastered")) {
      st.ledger[q.id] = { streak: 0, status: "active", lastCorrect: 0 };
    } else if (typeof e.lastCorrect !== "number") e.lastCorrect = 0;
  });
  return st;
}
function saveState() {
  const raw = JSON.stringify(state);
  memoryStore = raw;
  try { if (typeof localStorage !== "undefined") localStorage.setItem(LS_KEY, raw); } catch (e) {}
}
function wipeState() {
  memoryStore = null;
  try { if (typeof localStorage !== "undefined") localStorage.removeItem(LS_KEY); } catch (e) {}
  state = freshState();
}
let state = loadState();
let session = null;

/* ================= HELPERS ================= */
const app = document.getElementById("app");
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const entry = q => state.ledger[q.id];
const isMastered = q => entry(q).status === "mastered";
const onFinalPass = q => entry(q).status === "active" && entry(q).streak === STREAK_TO_MASTER - 1;
function isReady(q, now) {
  const e = entry(q);
  if (e.status !== "active") return false;
  if (e.streak === STREAK_TO_MASTER - 1 && FINAL_PASS_SPACING_MS > 0) {
    return now - e.lastCorrect >= FINAL_PASS_SPACING_MS;
  }
  return true;
}
function pools() {
  const now = Date.now();
  const active = BANK.filter(q => !isMastered(q));
  const ready = active.filter(q => isReady(q, now));
  const resting = active.filter(q => !isReady(q, now));
  return { now, active, ready, resting };
}
function animateBars() {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll(".bar>i").forEach(b => b.style.width = b.dataset.w + "%");
  }));
}

/* ================= HOME ================= */
function renderHome() {
  session = null;
  window.scrollTo(0, 0);
  app.innerHTML = "";
  const total = BANK.length;
  const mastered = BANK.filter(isMastered).length;
  const p = pools();

  app.appendChild(el("div", "ver", VERSION));
  app.appendChild(el("h1", "", QUIZ_NAME));
  const pills = el("div", "pills");
  TOPICS.forEach(t => {
    const s = el("span", "pill", t);
    s.style.color = colorOf(t); s.style.borderColor = colorOf(t);
    pills.appendChild(s);
  });
  app.appendChild(pills);

  const card = el("div", "card");
  const stats = el("div", "stats");
  const s1 = el("div", "stat"); s1.appendChild(el("div", "num", String(total - mastered))); s1.appendChild(el("div", "lab", "Active Questions"));
  const s2 = el("div", "stat"); s2.appendChild(el("div", "num", String(mastered))); s2.appendChild(el("div", "lab", "Completed"));
  stats.appendChild(s1); stats.appendChild(s2); card.appendChild(stats);
  const pct = total ? Math.round(100 * mastered / total) : 0;
  const bar = el("div", "bar"); const fill = el("i"); fill.dataset.w = pct; bar.appendChild(fill); card.appendChild(bar);
  card.appendChild(el("div", "pct", pct + "% completed"));
  card.appendChild(el("div", "how", "Answer correctly " + STREAK_TO_MASTER + " times in a row to complete a question. A wrong answer resets your progress on that question. Work through all " + total + " questions to finish."));
  app.appendChild(card);

  if (p.active.length === 0) {
    app.appendChild(el("div", "done", "All " + total + " questions completed. Well done!"));
  } else if (p.ready.length < Math.min(QS_PER_ROUND, p.active.length) && p.resting.length > 0) {
    const soonest = Math.min.apply(null, p.resting.map(q => entry(q).lastCorrect + FINAL_PASS_SPACING_MS - p.now));
    const mins = Math.max(1, Math.ceil(soonest / 60000));
    const msg = p.ready.length === 0
      ? "All remaining questions are resting before their final check. The next one is due in about " + mins + " min. You can wait, or continue now and they will come back early."
      : "Only " + p.ready.length + " question" + (p.ready.length === 1 ? " is" : "s are") + " due right now. If you continue, some resting questions will come back early to fill the round.";
    app.appendChild(el("div", "note", msg));
  }

  const go = el("button", "btn primary", "▶ Continue Progress");
  go.disabled = p.active.length === 0;
  go.onclick = startSession;
  app.appendChild(go);
  const rs = el("button", "btn danger", "↺ Start All Over");
  rs.onclick = showResetModal;
  app.appendChild(rs);

  const grid = el("div", "topics" + (TOPICS.length >= 7 ? " two" : ""));
  TOPICS.forEach(t => {
    const qs = BANK.filter(q => q.t === t);
    const m = qs.filter(isMastered).length;
    const half = qs.filter(q => !isMastered(q) && entry(q).streak >= 1).length;
    const c = el("div", "tcard");
    const nm = el("div", "tname", t); nm.style.color = colorOf(t); c.appendChild(nm);
    const row = el("div", "trow");
    const left = el("span", "half", half > 0 ? "▶" + half : "");
    if (half > 0) left.title = "One more correct answer to complete these";
    row.appendChild(left);
    row.appendChild(el("span", "", m + "/" + qs.length));
    c.appendChild(row);
    const b = el("div", "bar"); const f = el("i"); f.dataset.w = qs.length ? Math.round(100 * m / qs.length) : 0; f.style.background = colorOf(t); b.appendChild(f); c.appendChild(b);
    grid.appendChild(c);
  });
  app.appendChild(grid);
  animateBars();
}

/* ================= SESSION ================= */
function startSession() {
  const p = pools();
  if (p.active.length === 0) { renderHome(); return; }
  let picks = shuffle(p.ready).slice(0, QS_PER_ROUND);
  // Relief valve: if not enough questions are due, bring resting ones back early (longest-rested first).
  if (picks.length < QS_PER_ROUND && p.resting.length > 0) {
    const early = p.resting.slice().sort((a, b) => entry(a).lastCorrect - entry(b).lastCorrect);
    picks = picks.concat(early.slice(0, QS_PER_ROUND - picks.length));
    picks = shuffle(picks);
  }
  session = { qs: picks, i: 0, correct: 0, completed: 0, byTopic: {} };
  renderQuestion();
}

function renderQuestion() {
  window.scrollTo(0, 0);
  app.innerHTML = "";
  const q = session.qs[session.i];
  const finalPass = onFinalPass(q);

  const top = el("div", "qtop");
  const badge = el("span", "pill", q.t);
  badge.style.color = colorOf(q.t); badge.style.borderColor = colorOf(q.t);
  top.appendChild(badge);
  top.appendChild(el("span", "qcount", "Q " + (session.i + 1) + " of " + session.qs.length));
  app.appendChild(top);

  app.appendChild(el("div", "qtext", q.q));

  const hb = el("button", "hintbtn", finalPass ? "Hint not available for this one" : "Show hint");
  const hint = el("div", "hint", q.h);
  if (finalPass) { hb.disabled = true; }
  else hb.onclick = () => { const s = hint.classList.toggle("show"); hb.textContent = s ? "Hide hint" : "Show hint"; };
  app.appendChild(hb); app.appendChild(hint);

  const opts = el("div", "opts");
  const order = shuffle(q.o.map((_, i) => i));
  const buttons = [];
  order.forEach(idx => {
    const b = el("button", "opt", q.o[idx]);
    b.dataset.idx = idx;
    b.onclick = () => answer(q, idx, buttons, hb);
    buttons.push(b); opts.appendChild(b);
  });
  app.appendChild(opts);
}

function answer(q, idx, buttons, hb) {
  const ok = idx === q.a;
  const e = entry(q);
  if (ok) {
    e.streak++;
    e.lastCorrect = Date.now();
    if (e.streak >= STREAK_TO_MASTER) { e.status = "mastered"; session.completed++; }
    session.correct++;
  } else {
    e.streak = 0;
  }
  saveState(); // saved immediately after every answer

  const bt = session.byTopic[q.t] || (session.byTopic[q.t] = { drawn: 0, correct: 0 });
  bt.drawn++; if (ok) bt.correct++;

  hb.disabled = true;
  buttons.forEach(b => {
    b.disabled = true;
    const i = Number(b.dataset.idx);
    if (i === q.a) b.classList.add("correct");
    else if (i === idx) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  app.appendChild(el("div", "verdict " + (ok ? "ok" : "no"), ok ? "Correct" : "Not quite"));
  const ex = el("div", "expl"); ex.appendChild(el("b", "", "Why")); ex.appendChild(document.createTextNode(q.expl)); app.appendChild(ex);
  const ins = el("div", "insight"); ins.appendChild(el("b", "", "Key point to remember")); ins.appendChild(document.createTextNode(q.insight)); app.appendChild(ins);

  const bar = el("div", "nextbar");
  const last = session.i === session.qs.length - 1;
  const nx = el("button", "btn primary", last ? "See results →" : "Next →");
  nx.onclick = () => { session.i++; if (session.i >= session.qs.length) renderResults(); else renderQuestion(); };
  bar.appendChild(nx); app.appendChild(bar);
  nx.focus({ preventScroll: true });
}

/* ================= RESULTS ================= */
function renderResults() {
  window.scrollTo(0, 0);
  app.innerHTML = "";
  const s = session;
  const card = el("div", "card");
  card.appendChild(el("div", "score", s.correct + " / " + s.qs.length));
  card.appendChild(el("div", "scorelab", "correct this session"));
  if (s.completed > 0) card.appendChild(el("div", "badge", "+ " + s.completed + " question" + (s.completed === 1 ? "" : "s") + " completed this session"));
  app.appendChild(card);

  const tc = el("div", "card");
  const table = el("table");
  const hr = el("tr"); ["Topic", "Correct", "Drawn this session"].forEach(h => hr.appendChild(el("th", "", h))); table.appendChild(hr);
  TOPICS.filter(t => s.byTopic[t]).forEach(t => {
    const r = el("tr");
    const td = el("td", "", t); td.style.color = colorOf(t); td.style.fontWeight = "700"; r.appendChild(td);
    r.appendChild(el("td", "", String(s.byTopic[t].correct)));
    r.appendChild(el("td", "", String(s.byTopic[t].drawn)));
    table.appendChild(r);
  });
  tc.appendChild(table); app.appendChild(tc);

  const back = el("button", "btn primary", "Continue Studying →");
  back.onclick = renderHome;
  app.appendChild(back);
}

/* ================= RESET MODAL ================= */
function showResetModal() {
  const ov = el("div", "overlay");
  const m = el("div", "modal");
  m.appendChild(el("p", "", "This will erase all your progress. Are you sure?"));
  const row = el("div", "mrow");
  const cancel = el("button", "btn ghost", "Cancel");
  cancel.onclick = () => ov.remove();
  const confirm = el("button", "btn danger", "Confirm");
  confirm.onclick = () => { wipeState(); ov.remove(); renderHome(); };
  row.appendChild(cancel); row.appendChild(confirm); m.appendChild(row); ov.appendChild(m);
  document.body.appendChild(ov);
}

renderHome();
</script>
