<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G8 Physical Science MYE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;background:#f5f6fa;color:#1a1a2e;line-height:1.45;min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:16px 14px 110px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;margin-bottom:14px}
.ver{text-align:right;font-size:12px;color:#6b7080;margin-bottom:2px}
h1{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:12px;color:#1a1a2e}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{background:#fff;border:1.5px solid;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.stats{display:flex;gap:12px;margin-bottom:12px}
.stat{flex:1;text-align:center}
.stat .num{font-size:34px;font-weight:800;line-height:1.1}
.stat .lab{font-size:13px;color:#555a6b}
.bar{height:10px;background:#e6e8f0;border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:#1a1a2e;transition:width .8s ease}
.pct{font-size:12px;color:#555a6b;margin-top:4px;text-align:right}
.how{font-size:13.5px;color:#3c4052;margin-top:10px}
.note{font-size:13px;color:#7a4a00;background:#fff4e0;border-radius:8px;padding:8px 10px;margin-bottom:12px}
.done{font-size:15px;font-weight:700;color:#2e7d32;background:#e8f5e9;border-radius:8px;padding:10px 12px;margin-bottom:12px;text-align:center}
button{font-family:inherit;cursor:pointer}
.btn{display:block;width:100%;border-radius:10px;padding:14px;font-size:16px;font-weight:700;border:2px solid #1a1a2e;margin-bottom:10px}
.btn.primary{background:#1a1a2e;color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.danger{background:#fff;color:#c62828;border-color:#c62828}
.btn.ghost{background:#fff;color:#1a1a2e}
.topics{display:grid;gap:10px;grid-template-columns:1fr;margin-top:6px}
.topics.two{grid-template-columns:1fr 1fr}
.tcard{background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:10px;min-width:0}
.tname{font-size:13px;font-weight:700;line-height:1.25;min-height:2.5em}
.trow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#555a6b;margin:4px 0}
.half{color:#f57c00;font-weight:700}
.tcard .bar{height:7px}
/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.qcount{font-size:13px;color:#555a6b;white-space:nowrap}
.qtext{font-size:20px;font-weight:700;text-align:center;margin:8px 0 16px;line-height:1.35}
.hintbtn{display:block;margin:0 auto 6px;background:#fff;border:1.5px solid #1a1a2e;color:#1a1a2e;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.hintbtn:disabled{border-color:#c5c8d4;color:#a3a7b5;background:#eef0f5;cursor:not-allowed}
.hint{display:none;font-size:14px;background:#eef2ff;border-radius:8px;padding:9px 12px;margin:6px 0 4px;color:#27306b}
.hint.show{display:block}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{width:100%;text-align:left;background:#fff;border:2px solid #d5d8e3;border-radius:10px;padding:13px 14px;font-size:16px;color:#1a1a2e;transition:background-color .15s,border-color .15s,color .15s}
.opt:not(:disabled):hover{border-color:#1a1a2e}
.opt:disabled{cursor:default}
.opt.correct{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20;font-weight:700}
.opt.wrong{background:#ffebee;border-color:#c62828;color:#b71c1c;font-weight:700}
.opt.dim{opacity:.6}
.verdict{font-weight:800;font-size:16px;margin:16px 0 8px}
.verdict.ok{color:#2e7d32}.verdict.no{color:#c62828}
.expl{font-size:15px;background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08);margin-bottom:10px}
.insight{font-size:15px;border:1.5px solid #1a1a2e;background:#f3f4fa;border-radius:10px;padding:12px 14px}
.insight b,.expl b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#555a6b;margin-bottom:3px}
.nextbar{position:fixed;left:0;right:0;bottom:0;background:rgba(245,246,250,.96);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.nextbar .btn{max-width:612px;margin:0 auto}
/* results */
.score{font-size:44px;font-weight:800;text-align:center;line-height:1.1}
.scorelab{text-align:center;color:#555a6b;font-size:14px;margin-bottom:10px}
.badge{background:#e8f5e9;color:#2e7d32;font-weight:700;border-radius:999px;padding:7px 14px;text-align:center;font-size:14px;margin:0 auto 4px;width:fit-content}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid #e6e8f0;text-align:center}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:#555a6b;text-transform:uppercase;letter-spacing:.04em}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(26,26,46,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:360px;width:100%}
.modal p{font-size:16px;font-weight:600;margin-bottom:16px}
.mrow{display:flex;gap:10px}
.mrow .btn{margin:0}
@media (max-width:400px){
  #app{padding:12px 10px 110px}
  h1{font-size:23px}
  .tcard{padding:8px}
  .tname{font-size:12px}
  .trow{font-size:11px}
  .qtext{font-size:18px}
  .opt{font-size:15px;padding:12px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ================= CONFIG ================= */
const QUIZ_NAME = "G8 Physical Science MYE";
const VERSION = "ver1.00";
const LS_KEY = "g8_physical_science_mye_v1";
const QS_PER_ROUND = 12;
const STREAK_TO_MASTER = 2;
const FINAL_PASS_SPACING_MS = 5 * 60 * 1000;

/* ================= QUESTION BANK ================= */
const BANK = [
  {"t":"Elements & Atoms","q":"Which statement best defines an element?","o":["A pure substance that always exists as single atoms and never forms any molecules","A substance whose particles can be separated from each other only by physical methods","A pure substance that cannot be broken down into simpler substances by chemical reactions","A pure substance made of two or more different atoms joined in a fixed ratio"],"a":2,"h":"Think about what you get if you try to split it using chemistry.","expl":"An element is the simplest kind of substance. No chemical reaction can split it into anything simpler. Two or more different atoms joined in a fixed ratio describes a compound.","insight":"An element is a pure substance that cannot be broken down into simpler substances by chemical reactions."},
  {"t":"Elements & Atoms","q":"Which element is the most abundant in the universe?","o":["Carbon","Oxygen","Hydrogen","Helium"],"a":2,"h":"It is the lightest element and the main fuel of stars.","expl":"Hydrogen is the most abundant element in the universe, followed by helium. Oxygen is the most abundant in the Earth's crust and in the human body.","insight":"Universe: hydrogen (then helium). Earth's crust and human body: oxygen."},
  {"t":"Elements & Atoms","q":"What is the chemical symbol for sodium?","o":["S","Na","Sd","So"],"a":1,"h":"The symbol comes from its Latin name, natrium.","expl":"Sodium's symbol is Na, from the Latin name natrium. S is sulfur.","insight":"Sodium = Na (from natrium). Some symbols come from Latin names, not English names."},
  {"t":"Elements & Atoms","q":"What is the chemical symbol for potassium?","o":["Po","K","P","Pt"],"a":1,"h":"The symbol comes from its Latin name, kalium.","expl":"Potassium's symbol is K, from kalium. P is phosphorus.","insight":"Potassium = K. Phosphorus = P."},
  {"t":"Elements & Atoms","q":"Fe is the chemical symbol for which element?","o":["Tin","Iron","Fluorine","Lead"],"a":1,"h":"The Latin name is ferrum.","expl":"Fe comes from ferrum, the Latin name for iron. Fluorine is F.","insight":"Iron = Fe (from ferrum)."},
  {"t":"Elements & Atoms","q":"Which is the correct way to write the chemical symbol for magnesium?","o":["mG","MG","Mg","mg"],"a":2,"h":"Remember the rule about capital and lowercase letters in symbols.","expl":"The first letter of a symbol is always a capital and the second letter, if there is one, is always lowercase.","insight":"Chemical symbols: first letter capital, second letter lowercase (e.g. Mg, Ca, Cl)."},
  {"t":"Elements & Atoms","q":"Which element has the chemical symbol Cl?","o":["Chlorine","Carbon","Chromium","Calcium"],"a":0,"h":"It is a non-metal found in table salt.","expl":"Cl is chlorine. Calcium is Ca and carbon is C.","insight":"Chlorine = Cl, Calcium = Ca, Carbon = C."},
  {"t":"Elements & Atoms","q":"Which statement best defines an atom?","o":["A tiny charged particle that is shared when two elements are chemically joined","A group of two or more particles chemically joined in a fixed number","The smallest particle of a compound that keeps the properties of that compound","The smallest particle of an element that keeps the properties of that element"],"a":3,"h":"It is the basic building block of an element.","expl":"An atom is the smallest particle of an element that can exist and still have the properties of that element. Two or more atoms joined together make a molecule.","insight":"An atom is the smallest particle of an element that retains the properties of that element."},
  {"t":"Elements & Atoms","q":"Which formula shows a molecule of an element?","o":["O₂","NH₃","CO₂","H₂O"],"a":0,"h":"Look for a formula that contains only one type of atom.","expl":"O₂ contains two oxygen atoms and nothing else, so it is a molecule of an element. The other three contain different types of atoms, so they are molecules of compounds.","insight":"A molecule of an element contains a fixed number of the same type of atom chemically combined."},
  {"t":"Elements & Atoms","q":"Which formula shows a molecule of a compound?","o":["P₄","CH₄","O₃","S₈"],"a":1,"h":"Look for a formula that contains more than one type of atom.","expl":"CH₄ (methane) contains carbon and hydrogen atoms, so it is a molecule of a compound. O₃, P₄ and S₈ each contain only one type of atom.","insight":"A molecule of a compound contains a fixed number of different types of atoms chemically combined."},
  {"t":"Elements & Atoms","q":"How many atoms are there in total in the formula CaCO₃?","o":["7","5","8","6"],"a":1,"h":"No subscript after a symbol means one atom of that element.","expl":"Ca = 1 atom, C = 1 atom, O₃ = 3 atoms. 1 + 1 + 3 = 5 atoms.","insight":"The subscript gives the number of that atom; no subscript means exactly one atom."},
  {"t":"Elements & Atoms","q":"How many different elements are there in NaHCO₃?","o":["1","2","3","4"],"a":3,"h":"Count the different symbols. Each symbol starts with a capital letter.","expl":"The elements are sodium (Na), hydrogen (H), carbon (C) and oxygen (O), which makes 4.","insight":"Each capital letter starts a new element symbol: Na, H, C, O = 4 elements."},
  {"t":"Elements & Atoms","q":"Which statement correctly describes a covalent bond?","o":["A bond made when a pair of atoms is mixed without any chemical change","A bond made when two atoms are held together by opposite magnetic poles","A bond made when a pair of electrons is shared by two atoms","A bond made when one electron is passed from a metal to a non-metal"],"a":2,"h":"Think about what the two atoms do with their electrons.","expl":"In a covalent bond, two atoms share a pair of electrons. This is how atoms join to form molecules.","insight":"A covalent bond is a bond made when a pair of electrons is shared by two atoms."},
  {"t":"Elements & Atoms","q":"Oxygen gas is written as O₂. What does the 2 show?","o":["Oxygen combines with two other elements in the gas","Two oxygen molecules are mixed together in every sample","Each oxygen atom contains two smaller particles joined together","Each molecule contains two oxygen atoms joined together"],"a":3,"h":"The small number applies to the symbol just before it.","expl":"The subscript 2 tells you that one oxygen molecule is made of two oxygen atoms chemically joined.","insight":"A chemical formula shows the types and numbers of atoms in one molecule."},
  {"t":"Metals & Periodic Table","q":"Aluminium can be rolled into very thin foil. Which property does this show?","o":["Conductivity","Sonority","Malleability","Ductility"],"a":2,"h":"It is the property of being hammered or pressed into sheets.","expl":"Malleable means a material can be hammered or rolled into thin sheets without breaking. Ductile means it can be drawn into wires.","insight":"Malleable = can be hammered into sheets. Ductile = can be drawn into wires."},
  {"t":"Metals & Periodic Table","q":"Copper can be pulled out into long, thin wires. Which word describes this property?","o":["Ductile","Brittle","Sonorous","Malleable"],"a":0,"h":"It is different from being flattened into sheets.","expl":"Ductile means a metal can be drawn into wires. Malleable is about being hammered into sheets.","insight":"Metals are ductile: they can be drawn into wires."},
  {"t":"Metals & Periodic Table","q":"Bells are made of metal because metals ring when struck. Which word describes this property?","o":["Ductile","Sonorous","Malleable","Lustrous"],"a":1,"h":"The word is related to sound.","expl":"Sonorous means making a ringing sound when struck. Lustrous means shiny.","insight":"Metals are sonorous: they produce a ringing sound when struck."},
  {"t":"Metals & Periodic Table","q":"Which pair of properties is typical of a non-metal?","o":["Shiny appearance and high melting point","Dull appearance and poor electrical conductivity","Dull appearance and high melting point","Shiny appearance and poor electrical conductivity"],"a":1,"h":"Non-metals are generally the opposite of metals.","expl":"Non-metals are usually dull, poor conductors of heat and electricity, and have low melting and boiling points and low densities.","insight":"Non-metals: dull, low density, low melting and boiling points, poor conductors, not ductile or malleable."},
  {"t":"Metals & Periodic Table","q":"Which metal is a liquid at room temperature?","o":["Sodium","Bromine","Aluminium","Mercury"],"a":3,"h":"It was used in old thermometers.","expl":"Mercury is the only metal that is liquid at room temperature. Bromine is also a liquid, but it is a non-metal.","insight":"Exception: mercury (Hg) is a metal that is liquid at room temperature."},
  {"t":"Metals & Periodic Table","q":"Which non-metal is a good conductor of electricity?","o":["Phosphorus","Iodine","Sulfur","Graphite"],"a":3,"h":"It is a form of carbon found in pencils.","expl":"Graphite is a form of carbon. It is a non-metal but conducts electricity well, which makes it an exception.","insight":"Exception: graphite (a form of carbon) is a non-metal that conducts electricity."},
  {"t":"Metals & Periodic Table","q":"Silicon has some properties of metals and some properties of non-metals. What is it called?","o":["Non-metal","Metalloid","Metal","Alloy"],"a":1,"h":"The name means 'metal-like'.","expl":"Elements with properties of both metals and non-metals are metalloids. Silicon is a semiconductor used in computer chips.","insight":"Metalloids (e.g. silicon) show properties of both metals and non-metals."},
  {"t":"Metals & Periodic Table","q":"In the Periodic Table, what are the vertical columns called?","o":["Groups","Periods","Rows","Series"],"a":0,"h":"Elements in the same column are like a family.","expl":"Vertical columns are groups. Horizontal rows are periods.","insight":"Group = vertical column. Period = horizontal row."},
  {"t":"Metals & Periodic Table","q":"What is true about elements in the same group of the Periodic Table?","o":["Similar chemical properties","Similar physical states","Identical melting points","Equal atomic masses"],"a":0,"h":"Think about how they react.","expl":"Elements in the same group react in similar ways, so they have similar chemical properties.","insight":"Elements in the same group have similar chemical properties."},
  {"t":"Metals & Periodic Table","q":"How do the elements change as you move from left to right across a period?","o":["From gases to solids","From liquids to gases","From metals to non-metals","From non-metals to metals"],"a":2,"h":"Think about where sodium and chlorine sit in the same row.","expl":"Metals are on the left and non-metals are on the right, so the elements change from metallic to non-metallic across a period.","insight":"Across a period (left to right), elements change from metallic to non-metallic."},
  {"t":"Metals & Periodic Table","q":"Which description fits the Group 1 elements lithium, sodium and potassium?","o":["Brittle, dull non-metals with low melting points","Soft, reactive metals with low melting points","Unreactive gases that exist as single atoms","Hard, unreactive metals with high melting points"],"a":1,"h":"They can be cut with a knife and are stored under oil.","expl":"Group 1 elements are soft metals with low melting points and they are very reactive.","insight":"Group 1: soft, reactive metals with low melting points (Li, Na, K)."},
  {"t":"Metals & Periodic Table","q":"Helium, neon and argon are in the last group of the Periodic Table. How are they best described?","o":["Reactive metals","Unreactive metals","Reactive gases","Unreactive gases"],"a":3,"h":"They are called the noble gases.","expl":"The noble gases in the last group are inert. They are unreactive gases at room temperature.","insight":"Last group (noble gases: He, Ne, Ar): unreactive (inert) gases."},
  {"t":"Compounds","q":"Which statement best defines a compound?","o":["A pure substance of two or more elements chemically combined in a fixed proportion","A pure substance of two or more elements physically mixed in any proportion","An impure substance of two or more elements chemically combined in any proportion","A pure substance of one type of atom chemically joined in a fixed number"],"a":0,"h":"Three key ideas: pure, chemically combined, fixed proportion.","expl":"A compound is pure, contains two or more different elements, and the elements are chemically combined in a fixed proportion by mass.","insight":"A compound is a pure substance consisting of two or more different elements chemically combined in a fixed proportion by mass."},
  {"t":"Compounds","q":"Sodium is a reactive metal and chlorine is a toxic gas, but sodium chloride is safe to eat. What does this show about compounds?","o":["A compound has different properties from the elements that formed it","A compound contains its elements in proportions that can be freely varied","A compound keeps the same properties as the elements that formed it","A compound can be separated into its elements by simple physical methods"],"a":0,"h":"Compare the salt with the two elements it is made from.","expl":"When elements combine chemically, the compound formed has new properties that are different from those of its elements.","insight":"A compound has different properties from its constituent elements."},
  {"t":"Compounds","q":"Which method can break water down into hydrogen and oxygen?","o":["Evaporation","Distillation","Filtration","Electrolysis"],"a":3,"h":"A compound needs a chemical method, not a physical one.","expl":"Electrolysis uses an electric current to break a compound down chemically. Filtration, distillation and evaporation are physical methods that only separate mixtures.","insight":"Compounds can only be broken down by chemical methods, e.g. electrolysis or thermal decomposition."},
  {"t":"Compounds","q":"What is the name of the compound CaO?","o":["Carbon oxide","Calcium dioxide","Calcium oxide","Calcium hydroxide"],"a":2,"h":"Name the metal first, then change the ending of the non-metal.","expl":"Ca is calcium and O is oxygen. The metal is named first and oxygen becomes oxide, giving calcium oxide.","insight":"Metal first; a compound of two elements ends in -ide (CaO = calcium oxide)."},
  {"t":"Compounds","q":"What is the name of the compound NaOH?","o":["Sodium hydroxide","Sodium oxide","Sodium hydride","Sodium carbonate"],"a":0,"h":"The OH part has its own group name.","expl":"Na is sodium and the OH group is called hydroxide, so NaOH is sodium hydroxide.","insight":"The -OH group is hydroxide (oxygen + hydrogen)."},
  {"t":"Compounds","q":"What is the name of the compound CaCO₃?","o":["Calcium carbide","Calcium nitrate","Calcium carbonate","Calcium sulfate"],"a":2,"h":"The CO₃ part has its own group name.","expl":"The CO₃ group is called carbonate, so CaCO₃ is calcium carbonate. Sulfate is SO₄ and nitrate is NO₃.","insight":"-CO₃ = carbonate, -SO₄ = sulfate, -NO₃ = nitrate, -OH = hydroxide."},
  {"t":"Compounds","q":"What is the name of the compound CO?","o":["Monocarbon oxide","Carbon monoxide","Carbon dioxide","Carbon trioxide"],"a":1,"h":"The prefix tells you how many oxygen atoms there are.","expl":"CO has one oxygen atom, so the prefix mono- is used: carbon monoxide. CO₂ is carbon dioxide.","insight":"Prefixes show the number of atoms: mono- = one, di- = two."},
  {"t":"Compounds","q":"A compound made of only two elements usually has a name with which ending?","o":["-ium","-ide","-ate","-ite"],"a":1,"h":"Think of sodium chloride and magnesium oxide.","expl":"Compounds of two elements usually end in -ide, for example sodium chloride and hydrogen sulfide.","insight":"Two elements only: the name ends in -ide."},
  {"t":"Compounds","q":"Which elements are present in potassium nitrate, KNO₃?","o":["Potassium, nitrogen and oxygen","Phosphorus, nitrogen and oxygen","Potassium, neon and oxygen","Potassium, nitrogen and hydrogen"],"a":0,"h":"Read the formula one capital letter at a time.","expl":"K is potassium, N is nitrogen and O is oxygen. The nitrate group contains nitrogen and oxygen.","insight":"Nitrate (-NO₃) contains nitrogen and oxygen."},
  {"t":"Compounds","q":"What does the ending -ate (as in sulfate, carbonate and nitrate) tell you about a compound?","o":["The compound contains a metal only","The compound also contains hydrogen","The compound also contains oxygen","The compound contains only two elements"],"a":2,"h":"Look at the formulae SO₄, CO₃ and NO₃. What do they share?","expl":"Names ending in -ate show that oxygen is present as well as the other elements, for example CaSO₄ and CaCO₃.","insight":"An -ate ending shows the compound contains oxygen as well."},
  {"t":"Compounds","q":"Magnesium burns in oxygen to form magnesium oxide. Which way of forming a compound is this?","o":["Element and element","Element and compound","Compound and compound","Mixture and element"],"a":0,"h":"Decide whether each starting substance is an element or a compound.","expl":"Magnesium and oxygen are both elements, so the compound is formed from an element and an element.","insight":"Compounds can form from element + element, element + compound, or compound + compound."},
  {"t":"Compounds","q":"Water always contains hydrogen and oxygen in the same ratio by mass. Which property of compounds does this show?","o":["Elements are combined in a fixed proportion by mass","Elements can be separated again by physical methods","Elements keep their own properties inside the compound","Elements can be combined in any proportion by mass"],"a":0,"h":"The key word in the question is 'always'.","expl":"A compound always contains the same elements in the same proportion by mass. Mixtures can have any proportion.","insight":"In a compound, the elements are combined in a fixed proportion by mass."},
  {"t":"Compounds","q":"Diamond and sodium chloride both have giant structures. What does this suggest about them?","o":["They are gases at room temperature because their particles are far apart","They have low melting points because their small molecules separate very easily","They dissolve easily in water because their particles are only weakly held","They have high melting points because many strong bonds must be broken"],"a":3,"h":"A giant structure has a huge number of particles all bonded together.","expl":"In a giant structure, very many strong bonds hold the particles together, so a lot of energy is needed to melt it. Simple molecular substances have low melting points.","insight":"Giant structures have high melting points; simple (small molecule) structures have low melting points."},
  {"t":"Compounds","q":"Iron and sulfur are heated until they glow and form iron sulfide. What shows that a compound has formed?","o":["The iron can still be removed with a magnet","The amounts of iron and sulfur can be varied","The two powders can still be seen separately","A new substance with different properties is produced"],"a":3,"h":"A chemical reaction always makes something new.","expl":"A compound is formed by a chemical reaction, which produces a new substance. Iron sulfide is not attracted to a magnet and looks different from iron and sulfur.","insight":"Compounds are formed by chemical reactions; a new substance with different properties is produced."},
  {"t":"Mixtures","q":"Which statement best defines a mixture?","o":["Two or more compounds joined together by a chemical reaction","Two or more elements chemically combined in a fixed proportion by mass","One type of atom only, which cannot be broken down chemically","Two or more elements and/or compounds that are not chemically combined"],"a":3,"h":"The substances are together, but have they reacted?","expl":"In a mixture the substances are only physically mixed. They are not chemically combined.","insight":"A mixture is made up of two or more elements and/or compounds that are not chemically combined."},
  {"t":"Mixtures","q":"About what percentage of clean, dry air is nitrogen?","o":["72%","87%","68%","78%"],"a":3,"h":"It is by far the most common gas in air.","expl":"Clean, dry air is about 78% nitrogen, 21% oxygen, and small amounts of argon, carbon dioxide and other gases.","insight":"Air: 78% nitrogen, 21% oxygen, small amounts of carbon dioxide and other gases."},
  {"t":"Mixtures","q":"About what percentage of clean, dry air is oxygen?","o":["31%","38%","28%","21%"],"a":3,"h":"It is roughly one fifth of the air.","expl":"Oxygen makes up about 21% of clean, dry air. Nitrogen makes up about 78%.","insight":"Air: 21% oxygen, 78% nitrogen."},
  {"t":"Mixtures","q":"Brass is an alloy. Which metals is it made from?","o":["Copper and zinc","Copper and tin","Nickel and chromium","Iron and carbon"],"a":0,"h":"Brass is a yellow-gold colour and is used in musical instruments.","expl":"Brass is copper mixed with zinc. Bronze is copper and tin, steel is iron and carbon, and nichrome is nickel and chromium.","insight":"Brass = copper + zinc. Bronze = copper + tin. Steel = iron + carbon."},
  {"t":"Mixtures","q":"Using the particle model, why is an alloy such as brass harder than pure copper?","o":["Atoms of different sizes disrupt the regular layers, so they cannot slide easily","Atoms of different sizes move further apart, so the metal becomes less dense","Atoms of the same size pack into regular layers, so they slide easily","Atoms of different sizes bond chemically, so a new hard compound is formed"],"a":0,"h":"In a pure metal the layers of atoms can slide over each other.","expl":"In pure copper, identical atoms sit in regular layers that slide easily. Zinc atoms are a different size, so they break up the layers and stop them sliding.","insight":"In an alloy, atoms of different sizes disrupt the regular layers, so the layers cannot slide over each other easily."},
  {"t":"Mixtures","q":"Which statement about mixtures is correct?","o":["Its constituents lose their own properties and are joined in a fixed proportion","Its constituents keep their own properties and can be mixed in any proportion","Its constituents lose their own properties but can be mixed in any proportion","Its constituents keep their own properties but must be in a fixed proportion"],"a":1,"h":"Compare a mixture with a compound on two points: properties and proportion.","expl":"A mixture has the same properties as its constituents, and the constituents can be mixed in any proportion by mass.","insight":"Mixtures: not formed by chemical reactions, separated by physical methods, same properties as constituents, any proportion by mass."},
  {"t":"Mixtures","q":"Substance A melts over a range of temperatures, from 60 °C to 68 °C. What is A most likely to be?","o":["Mixture","Element","Compound","Molecule"],"a":0,"h":"Pure substances melt at one fixed temperature.","expl":"Pure substances (elements and compounds) have fixed melting and boiling points. A range of temperatures shows the substance is a mixture.","insight":"A mixture melts and boils over a range of temperatures; a pure substance has fixed melting and boiling points."},
  {"t":"Mixtures","q":"Substance B has a fixed melting point and can be broken down into simpler substances by electrolysis. What is B?","o":["Element","Alloy","Mixture","Compound"],"a":3,"h":"It is pure, but it can still be split chemically.","expl":"A fixed melting point means B is pure. Being broken down chemically into simpler substances means it is a compound, not an element.","insight":"Fixed melting point + can be broken down chemically = compound."},
  {"t":"Mixtures","q":"Substance C has a fixed boiling point and cannot be broken down by any chemical method. What is C?","o":["Element","Mixture","Compound","Alloy"],"a":0,"h":"It is pure and it is already as simple as possible.","expl":"A fixed boiling point means C is pure. It cannot be broken down chemically, so it is an element.","insight":"Fixed boiling point + cannot be broken down chemically = element."},
  {"t":"Mixtures","q":"A particle diagram shows only one kind of particle. Each particle is made of two different atoms joined together. What does the diagram show?","o":["A mixture of compounds","A mixture of elements","A pure compound","A pure element"],"a":2,"h":"One kind of particle means pure. Different atoms joined means...?","expl":"Only one kind of particle means the substance is pure. Each particle contains different atoms chemically joined, so it is a compound.","insight":"Element: one type of atom. Compound: different atoms joined, all particles identical. Mixture: more than one kind of particle."},
  {"t":"Mixtures","q":"In chemistry, what does it mean to say that a substance is pure?","o":["It contains nothing that would be harmful to drink","It comes straight from a natural, untreated source","It contains only one element or one compound","It contains only substances that are fully dissolved"],"a":2,"h":"The everyday meaning and the chemistry meaning are different.","expl":"In chemistry, pure means made of only one substance (one element or one compound), with nothing else mixed in.","insight":"A pure substance is made of one type of element or compound only, not mixed with any other substance."},
  {"t":"Mixtures","q":"Iron filings and sulfur powder are stirred together without heating. Which observation shows the result is only a mixture?","o":["The powders can no longer be separated","Heat and light are given out strongly","A magnet can still pull the iron out","A new black solid has been formed"],"a":2,"h":"In a mixture, each substance keeps its own properties.","expl":"The iron is still magnetic, so it has kept its own properties and can be separated by a physical method. No new substance has formed.","insight":"A mixture can be separated by physical methods because its constituents keep their own properties."},
  {"t":"Separating Mixtures","q":"What is filtration used to separate?","o":["Two liquids with different boiling points","Several coloured dyes in an ink","An insoluble solid from a liquid","A dissolved solid from its solvent"],"a":2,"h":"Think about what the tiny holes in filter paper can stop.","expl":"Filter paper lets liquid through but traps solid particles that have not dissolved, so filtration separates an insoluble solid from a liquid.","insight":"Filtration separates an insoluble solid from a liquid."},
  {"t":"Separating Mixtures","q":"In filtration, what is the liquid that passes through the filter paper called?","o":["Filtrate","Distillate","Residue","Solute"],"a":0,"h":"The word comes from 'filter'.","expl":"The liquid that passes through is the filtrate. The solid left on the filter paper is the residue.","insight":"Filtrate = liquid that passes through. Residue = solid left on the filter paper."},
  {"t":"Separating Mixtures","q":"Which method is used to obtain solid salt from salt solution?","o":["Evaporation","Filtration","Chromatography","Condensation"],"a":0,"h":"The salt is dissolved, so filter paper cannot trap it.","expl":"Heating the solution makes the water evaporate, leaving the solid salt behind. Filtration would not work because the salt is dissolved.","insight":"Evaporation is used to obtain a soluble solid (solute) from a solution."},
  {"t":"Separating Mixtures","q":"Which method would you use to obtain pure water from seawater?","o":["Paper chromatography","Simple distillation","Direct evaporation","Gravity filtration"],"a":1,"h":"You need to keep the water, not the salt.","expl":"Simple distillation boils the water and then condenses the steam so the pure water is collected. Evaporation would lose the water.","insight":"Simple distillation is used to obtain the solvent from a solution."},
  {"t":"Separating Mixtures","q":"Which two changes of state take place during simple distillation, in the correct order?","o":["Melting then evaporation","Evaporation then freezing","Boiling then condensation","Condensation then boiling"],"a":2,"h":"First the liquid becomes a gas, then the gas becomes a liquid again.","expl":"The liquid is boiled into vapour, then the vapour is cooled in the condenser and condenses back into liquid.","insight":"Distillation involves boiling followed by condensation."},
  {"t":"Separating Mixtures","q":"What is the job of the condenser in distillation?","o":["It cools the vapour so that it turns back into a liquid","It measures the temperature so that the boiling point is always known","It traps the solid particles so that only the liquid passes through","It heats the mixture so that the liquid turns into a vapour"],"a":0,"h":"Cold water flows around the outside of it.","expl":"The condenser is kept cold by flowing water. Hot vapour passing through it cools and condenses into liquid, which is collected as the distillate.","insight":"The condenser cools the vapour so that it condenses into a liquid (the distillate)."},
  {"t":"Separating Mixtures","q":"Alcohol boils at 78 °C and water boils at 100 °C. When a mixture of the two is distilled, which liquid is collected first, and why?","o":["Water, because it has the higher boiling point","Alcohol, because it has the lower boiling point","Water, because it makes up most of the mixture","Alcohol, because it has the smaller particle size"],"a":1,"h":"Which liquid turns into vapour first as the mixture heats up?","expl":"The liquid with the lower boiling point boils first, so alcohol turns to vapour, enters the condenser and is collected first.","insight":"Distillation separates liquids by their different boiling points; the liquid with the lower boiling point is collected first."},
  {"t":"Separating Mixtures","q":"Which method is used to separate crude oil into petrol, kerosene and diesel?","o":["Paper chromatography","Fractional distillation","Simple distillation","Repeated filtration"],"a":1,"h":"Crude oil is a mixture of many liquids with different boiling points.","expl":"Fractional distillation uses a fractionating column to separate a mixture of several liquids with different boiling points.","insight":"Fractional distillation separates a mixture of several liquids with different boiling points, e.g. crude oil."},
  {"t":"Separating Mixtures","q":"Which technique is used to separate and identify the dyes in a food colouring?","o":["Evaporation","Filtration","Distillation","Chromatography"],"a":3,"h":"A spot of the colouring is placed on paper and a solvent moves up.","expl":"Paper chromatography separates small amounts of dissolved substances such as dyes, and lets you identify them.","insight":"Paper chromatography is used to separate and identify substances (e.g. dyes) in a sample."},
  {"t":"Separating Mixtures","q":"In paper chromatography, why do different dyes separate as the solvent moves up the paper?","o":["They have different particle sizes, so some are trapped by the filter paper","They have different solubilities in the solvent, so travel at different rates","They have different boiling points in the solvent, so evaporate at different times","They have different magnetic strengths, so some are pulled further up the paper"],"a":1,"h":"The more easily a dye dissolves, the further it is carried.","expl":"Dyes that are more soluble in the solvent are carried further up the paper. Less soluble dyes travel a shorter distance.","insight":"Dyes separate because they have different solubilities in the solvent, so they travel at different rates up the paper."},
  {"t":"Separating Mixtures","q":"On a chromatogram, a black ink gives three separate coloured spots. What does this show?","o":["The black ink is a mixture of three dyes","The black ink is insoluble in the solvent used","The black ink is a compound of three elements","The black ink is a pure substance with three atoms"],"a":0,"h":"A pure substance would give only one spot.","expl":"Each spot is a different dye. Three spots show the ink is a mixture of three dyes. A pure substance gives a single spot.","insight":"On a chromatogram, one spot = pure substance; more than one spot = mixture."},
  {"t":"Separating Mixtures","q":"Why is a water bath sometimes used for evaporation instead of heating the solution directly?","o":["It heats the solution gently, so the solid does not spit or decompose","It filters the solution slowly, so the insoluble solid is left behind","It cools the vapour quickly, so the solvent can be collected as liquid","It heats the solution strongly, so the solvent boils away much faster"],"a":0,"h":"A water bath cannot get hotter than boiling water.","expl":"A water bath gives gentle, even heating at no more than 100 °C. This stops the solid spitting out or breaking down when it is nearly dry.","insight":"A water bath gives gentle heating, which prevents spitting and stops the solid from decomposing."},
  {"t":"Separating Mixtures","q":"Rock salt is a mixture of salt and sand. What is the correct order of steps to obtain pure, dry salt?","o":["Evaporate, dissolve, filter","Filter, dissolve, evaporate","Dissolve, evaporate, filter","Dissolve, filter, evaporate"],"a":3,"h":"Salt dissolves in water but sand does not.","expl":"Add water to dissolve the salt, filter to remove the insoluble sand, then evaporate the water from the filtrate to leave the salt.","insight":"Soluble solid + insoluble solid: dissolve, filter, then evaporate the filtrate."},
  {"t":"Solutions & Solubility","q":"Salt is dissolved in water to make salt solution. What is the salt called?","o":["Residue","Solution","Solute","Solvent"],"a":2,"h":"It is the substance that gets dissolved.","expl":"The solute is the substance that dissolves. The solvent is the liquid it dissolves in. Together they form the solution.","insight":"Solute = substance that dissolves. Solvent = substance it dissolves in. Solute + solvent = solution."},
  {"t":"Solutions & Solubility","q":"15 g of salt is dissolved completely in 100 g of water. What is the mass of the solution?","o":["85 g","100 g","115 g","105 g"],"a":2,"h":"No mass is lost when a solute dissolves.","expl":"Mass of solution = mass of solute + mass of solvent = 15 g + 100 g = 115 g.","insight":"Mass of solution = mass of solute + mass of solvent."},
  {"t":"Solutions & Solubility","q":"What happens to the solute particles when a solid dissolves?","o":["They sink slowly and collect together at the bottom","They break down into smaller atoms and then disappear completely","They react with the solvent particles to form a new compound","They separate and spread evenly between the solvent particles"],"a":3,"h":"The solid seems to vanish, but its mass is still there.","expl":"The solute particles separate from each other and spread out evenly between the solvent particles. This is why the solution looks the same throughout.","insight":"When a solute dissolves, its particles separate and spread evenly between the solvent particles."},
  {"t":"Solutions & Solubility","q":"Beaker A has 2 g of sugar dissolved in 100 cm³ of water. Beaker B has 20 g of sugar dissolved in 100 cm³ of water. Which statement is correct?","o":["A and B are both saturated","A and B are equally concentrated","A is more concentrated than B","B is more concentrated than A"],"a":3,"h":"The volume of water is the same. Compare the amount of solute.","expl":"B has more solute in the same volume of solvent, so B is the more concentrated solution. A is the more dilute solution.","insight":"A concentrated solution has a large amount of solute in a given amount of solvent; a dilute solution has a small amount."},
  {"t":"Solutions & Solubility","q":"Which statement best describes a saturated solution?","o":["It contains more solvent than any other solution at that temperature","It contains a small amount of solute dissolved in a large amount of solvent","It contains a solute that has reacted completely with the solvent","It contains the maximum amount of solute that can dissolve at that temperature"],"a":3,"h":"If you add more solute, it just sits at the bottom.","expl":"A saturated solution cannot dissolve any more solute at that temperature. Any extra solute stays undissolved at the bottom.","insight":"A saturated solution contains the maximum amount of solute that can dissolve in a given amount of solvent at a given temperature."},
  {"t":"Solutions & Solubility","q":"The solubility of salt is 36 g per 100 g of water at 20 °C. What is the maximum mass of salt that can dissolve in 50 g of water at 20 °C?","o":["36 g","72 g","9 g","18 g"],"a":3,"h":"Half the water can hold half the salt.","expl":"(36 ÷ 100) × 50 = 18 g.","insight":"Maximum mass dissolved = (solubility ÷ 100) × mass of water."},
  {"t":"Solutions & Solubility","q":"The solubility of salt is 36 g per 100 g of water at 20 °C. 58 g of salt is added to 150 g of water at 20 °C and stirred. What mass of salt stays undissolved?","o":["4 g","3 g","6 g","8 g"],"a":0,"h":"First work out how much salt 150 g of water can hold.","expl":"Maximum that dissolves = (36 ÷ 100) × 150 = 54 g. Undissolved salt = 58 − 54 = 4 g.","insight":"Undissolved mass = mass added − maximum mass that can dissolve."},
  {"t":"Solutions & Solubility","q":"How does heating the solvent usually affect solubility?","o":["Solids become less soluble, but gases become more soluble","Both solids and gases become less soluble in water","Solids become more soluble, but gases become less soluble","Both solids and gases become more soluble in water"],"a":2,"h":"Think about sugar in hot tea, and about a warm fizzy drink going flat.","expl":"For most solid solutes, solubility increases as temperature increases. For gases, solubility decreases as temperature increases.","insight":"As temperature increases, the solubility of most solids increases but the solubility of gases decreases."},
  {"t":"Solutions & Solubility","q":"Which change makes sugar dissolve faster but does NOT change how much sugar can dissolve?","o":["Stirring the mixture","Changing the solute","Changing the solvent","Raising the temperature"],"a":0,"h":"Separate 'how fast' from 'how much'.","expl":"Stirring only affects the rate of dissolving. Temperature, the nature of the solute and the nature of the solvent affect solubility (how much dissolves).","insight":"Solubility depends on temperature, nature of solute and nature of solvent. Rate of dissolving depends on temperature, stirring and size of solute."},
  {"t":"Solutions & Solubility","q":"Why does powdered sugar dissolve faster than a sugar cube of the same mass?","o":["The powder has a larger surface area in contact with the water","The powder has smaller molecules that fit between water particles","The powder has a higher solubility than the cube in water","The powder has a lower mass, so less needs to dissolve"],"a":0,"h":"Think about how much of the sugar the water can touch.","expl":"Smaller pieces have a larger total surface area, so more solute particles are in contact with the solvent and it dissolves faster. The solubility stays the same.","insight":"Smaller solute particles have a larger surface area, which increases the rate of dissolving."},
  {"t":"Solutions & Solubility","q":"Why do bubbles appear when a bottle of soft drink is opened?","o":["Pressure falls, so the water boils and forms steam bubbles","Pressure rises, so carbon dioxide becomes less soluble and escapes","Pressure falls, so carbon dioxide becomes less soluble and escapes","Temperature falls, so carbon dioxide becomes more soluble and escapes"],"a":2,"h":"The drink was bottled under high pressure.","expl":"High pressure keeps a lot of carbon dioxide dissolved. Opening the bottle lowers the pressure, so the gas becomes less soluble and comes out as bubbles.","insight":"The solubility of a gas decreases when the pressure decreases."},
  {"t":"Solutions & Solubility","q":"The solubility of substance X is 110 g per 100 g of water at 60 °C and 30 g per 100 g of water at 20 °C. A saturated solution of X in 100 g of water is cooled from 60 °C to 20 °C. What mass of crystals forms?","o":["80 g","30 g","110 g","140 g"],"a":0,"h":"Find the difference between what the water can hold hot and cold.","expl":"At 60 °C the water holds 110 g. At 20 °C it can hold only 30 g. 110 − 30 = 80 g comes out of solution as crystals.","insight":"Mass of crystals formed on cooling = solubility at the higher temperature − solubility at the lower temperature."},
  {"t":"Solutions & Solubility","q":"How is the concentration of a solution calculated?","o":["Volume of solvent divided by amount of solute","Mass of solution minus mass of solvent","Amount of solute divided by volume of solvent","Amount of solute multiplied by volume of solvent"],"a":2,"h":"More solute in the same volume should give a bigger answer.","expl":"Concentration tells you how much solute there is in a given volume of solvent, so it is the amount of solute divided by the volume of the solvent.","insight":"Concentration = amount of solute ÷ volume of solvent."},
  {"t":"Hearing Sound","q":"How is every sound produced?","o":["Vibrations","Reflections","Radiations","Refractions"],"a":0,"h":"Touch your throat while you are talking.","expl":"Sound is a form of energy produced by vibrations, which are to-and-fro movements. When the vibrations stop, the sound stops.","insight":"Sound is a form of energy produced by vibrations."},
  {"t":"Hearing Sound","q":"Why can sound not travel through a vacuum?","o":["The particles are packed too closely together to vibrate","There are no light rays to carry the sound energy","There are no particles to pass the vibrations along","The sound waves travel too slowly to be detected"],"a":2,"h":"What is a vacuum missing?","expl":"Sound needs a medium (solid, liquid or gas). The vibrations are passed from particle to particle. A vacuum has no particles, so sound cannot travel through it.","insight":"Sound needs a medium to travel; a vacuum has no particles to pass on the vibrations."},
  {"t":"Hearing Sound","q":"An electric bell rings inside a bell jar while the air is pumped out. What is observed?","o":["The sound gets higher in pitch as the hammer moves faster","The sound gets louder although the hammer is still seen moving","The sound gets quieter although the hammer is still seen moving","The sound stays the same because sound needs no medium"],"a":2,"h":"Light can cross a vacuum. Can sound?","expl":"As the air is removed there are fewer particles to carry the vibrations, so the sound fades. The hammer can still be seen because light does not need a medium.","insight":"The bell jar experiment shows that sound needs a medium to travel, but light does not."},
  {"t":"Hearing Sound","q":"In which of these does sound travel fastest?","o":["Water","Vacuum","Steel","Air"],"a":2,"h":"Think about how close together the particles are.","expl":"Sound travels fastest in solids, slower in liquids and slowest in gases. It cannot travel in a vacuum at all.","insight":"Speed of sound: solids > liquids > gases."},
  {"t":"Hearing Sound","q":"What is the approximate speed of sound in air at 20 °C?","o":["143 m/s","243 m/s","443 m/s","343 m/s"],"a":3,"h":"It is a few hundred metres per second.","expl":"Sound travels at about 343 m/s in air at 20 °C. It is about 1482 m/s in water and 5960 m/s in steel.","insight":"Speed of sound in air ≈ 343 m/s (about 340 m/s)."},
  {"t":"Hearing Sound","q":"Why does sound travel faster in a solid than in a gas?","o":["Particles are further apart, so vibrations have more room to move","Particles are free to flow, so vibrations spread out more easily","Particles are heavier, so each vibration carries much more sound","Particles are closer together, so vibrations pass on more quickly"],"a":3,"h":"Vibrations are passed on when particles collide with their neighbours.","expl":"In a solid the particles are tightly packed, so each vibrating particle quickly passes its vibration to the next one.","insight":"Particles in solids are closer together, so vibrations are passed on more quickly."},
  {"t":"Hearing Sound","q":"In a sound wave, what is a region where the air particles are squeezed close together called?","o":["Compression","Reflection","Rarefaction","Vibration"],"a":0,"h":"The word means 'pressed together'.","expl":"A compression is a high-pressure region where particles are close together. A rarefaction is a low-pressure region where particles are spread out.","insight":"Compression = particles close together (high pressure). Rarefaction = particles spread out (low pressure)."},
  {"t":"Hearing Sound","q":"How do the air particles move as a sound wave passes through the air?","o":["They vibrate to and fro about their positions without travelling to the listener","They stay completely still while the sound energy jumps between them","They move up and down at right angles to the direction of the sound","They travel in a straight line all the way from source to listener"],"a":0,"h":"The energy travels to your ear. Do the particles?","expl":"Each air particle vibrates backwards and forwards about its own position and passes the vibration on. The particles do not travel from the source to the ear.","insight":"Air particles vibrate to and fro and pass on the energy; they do not travel with the sound wave."},
  {"t":"Hearing Sound","q":"Which shows the correct order in which vibrations pass through the ear?","o":["Cochlea → eardrum → ossicles → auditory nerve","Eardrum → cochlea → ossicles → auditory nerve","Eardrum → ossicles → cochlea → auditory nerve","Ossicles → eardrum → cochlea → auditory nerve"],"a":2,"h":"Go from the outer ear, to the middle ear, to the inner ear.","expl":"Sound enters through the pinna and ear canal, makes the eardrum vibrate, passes through the ossicles to the cochlea, and signals travel along the auditory nerve to the brain.","insight":"Pinna → ear canal → eardrum → ossicles (hammer, anvil, stirrup) → cochlea → auditory nerve → brain."},
  {"t":"Hearing Sound","q":"What is the function of the pinna?","o":["It collects sound waves and directs them into the ear canal","It vibrates when sound waves reach the end of the ear canal","It amplifies the vibrations and passes them to the inner ear","It changes the vibrations into electrical signals for the brain"],"a":0,"h":"It is the part of the ear you can see, shaped like a funnel.","expl":"The pinna is the funnel-shaped outer ear. It collects sound waves and directs them down the ear canal.","insight":"The pinna collects sound waves and directs them into the ear canal."},
  {"t":"Hearing Sound","q":"Which part of the ear is a thin membrane that vibrates when sound waves hit it?","o":["Pinna","Stirrup","Eardrum","Cochlea"],"a":2,"h":"Its name tells you it behaves like the skin of a musical instrument.","expl":"The eardrum is a thin membrane at the end of the ear canal. It vibrates when sound waves reach it.","insight":"The eardrum is a thin membrane that vibrates when sound waves reach it."},
  {"t":"Hearing Sound","q":"What do the three small bones in the middle ear (hammer, anvil and stirrup) do?","o":["Amplify the vibrations and pass them on to the cochlea","Change the vibrations into signals and pass them to the brain","Protect the eardrum by absorbing vibrations that are too loud","Collect the sound waves and pass them on to the eardrum"],"a":0,"h":"They work like a set of tiny levers.","expl":"The ossicles amplify the vibrations from the eardrum and transfer them to the cochlea in the inner ear.","insight":"The ossicles (hammer, anvil, stirrup) amplify the vibrations and pass them to the inner ear."},
  {"t":"Hearing Sound","q":"In which part of the ear are vibrations changed into electrical signals?","o":["Pinna","Cochlea","Eardrum","Anvil"],"a":1,"h":"It is a coiled tube filled with fluid and tiny hair cells.","expl":"In the cochlea, vibrations travel through fluid and move tiny hair cells, which produce electrical signals. The auditory nerve carries these signals to the brain.","insight":"The cochlea changes vibrations into electrical signals; the auditory nerve carries them to the brain."},
  {"t":"Pitch & Loudness","q":"Which statement best defines frequency?","o":["The maximum distance a particle moves from its rest position","The number of complete vibrations made in one second","The total time taken for one complete vibration to finish","The distance measured between one crest and the next crest"],"a":1,"h":"It is about how often something happens.","expl":"Frequency is the number of complete vibrations (or waves) each second. The maximum distance from the rest position is the amplitude.","insight":"Frequency is the number of complete vibrations per second, measured in hertz (Hz)."},
  {"t":"Pitch & Loudness","q":"What is the unit of frequency?","o":["Newtons","Hertz","Decibels","Metres"],"a":1,"h":"Its symbol is Hz.","expl":"Frequency is measured in hertz (Hz). 1 Hz means one vibration per second.","insight":"Unit of frequency: hertz (Hz)."},
  {"t":"Pitch & Loudness","q":"A guitar string makes 600 complete vibrations in 3 seconds. What is its frequency?","o":["300 Hz","100 Hz","600 Hz","200 Hz"],"a":3,"h":"Frequency is the number of vibrations in ONE second.","expl":"Frequency = number of vibrations ÷ time = 600 ÷ 3 = 200 Hz.","insight":"Frequency = number of vibrations ÷ time taken (in seconds)."},
  {"t":"Pitch & Loudness","q":"What is the highest frequency that a person with normal hearing can usually detect?","o":["20 000 Hz","25 000 Hz","10 000 Hz","15 000 Hz"],"a":0,"h":"The human hearing range starts at 20 Hz.","expl":"The range of human hearing is about 20 Hz to 20 000 Hz. The upper limit gets lower as people get older.","insight":"Human hearing range: 20 Hz to 20 000 Hz."},
  {"t":"Pitch & Loudness","q":"What are sounds with frequencies above 20 000 Hz called?","o":["Noise","Echoes","Infrasound","Ultrasound"],"a":3,"h":"The prefix means 'beyond'.","expl":"Sounds above 20 000 Hz are ultrasound (used by bats and in medical imaging). Sounds below 20 Hz are infrasound (used by elephants).","insight":"Ultrasound: above 20 000 Hz. Infrasound: below 20 Hz."},
  {"t":"Pitch & Loudness","q":"Which string would produce the note with the highest pitch?","o":["Short, thick and loose","Long, thick and loose","Short, thin and tight","Long, thin and tight"],"a":2,"h":"Think about the strings on a violin compared with a double bass.","expl":"Short, thin and tight strings vibrate fastest, so they have the highest frequency and the highest pitch.","insight":"Shorter, thinner and tighter strings vibrate faster and give a higher pitch."},
  {"t":"Pitch & Loudness","q":"A guitar string is tightened. What happens to the note it produces?","o":["It vibrates faster, so the sound becomes much louder","It vibrates further, so the sound becomes louder","It vibrates faster, so the pitch becomes higher","It vibrates more slowly, so the pitch becomes lower"],"a":2,"h":"Tension changes how fast the string vibrates, not how far.","expl":"More tension makes the string vibrate faster. A higher frequency gives a higher pitch.","insight":"Higher frequency = higher pitch. Increasing tension increases frequency."},
  {"t":"Pitch & Loudness","q":"Which statement best defines amplitude?","o":["The number of complete vibrations made in each second","The distance from one crest to the next crest","The maximum displacement of a particle from its rest position","The total distance travelled by the wave each second"],"a":2,"h":"On a wave trace it is the height of a crest above the centre line.","expl":"Amplitude is the maximum distance a particle moves from its rest position. On a trace it is the height from the centre line to a crest.","insight":"Amplitude is the maximum displacement from the rest position."},
  {"t":"Pitch & Loudness","q":"Hitting a drum harder makes a louder sound. What has changed about the vibrations?","o":["Higher frequency","Smaller amplitude","Lower frequency","Larger amplitude"],"a":3,"h":"Loudness depends on how big the vibrations are.","expl":"A harder hit gives the drum skin more energy, so it vibrates with a larger amplitude and the sound is louder.","insight":"Larger amplitude = louder sound. Smaller amplitude = softer sound."},
  {"t":"Pitch & Loudness","q":"In which unit is the loudness of a sound measured?","o":["Decibels","Hertz","Metres","Newtons"],"a":0,"h":"Its symbol is dB.","expl":"Loudness is measured in decibels (dB) using a sound level meter. Hertz is the unit of frequency.","insight":"Loudness is measured in decibels (dB); frequency is measured in hertz (Hz)."},
  {"t":"Pitch & Loudness","q":"Which instrument is connected to a microphone to display the trace of a sound wave on a screen?","o":["Thermometer","Oscilloscope","Stethoscope","Loudspeaker"],"a":1,"h":"Its name comes from 'oscillate', which means to vibrate.","expl":"A microphone changes the sound into an electrical signal and the oscilloscope shows it as a wave trace on its screen.","insight":"An oscilloscope with a microphone is used to display the trace of a sound wave."},
  {"t":"Pitch & Loudness","q":"Compared with a quiet note, how does the trace of a louder note of the same pitch look?","o":["Closer waves with the same height","Shorter waves with the same spacing","Taller waves with the same spacing","Wider waves with the same height"],"a":2,"h":"Loudness changes one feature of the trace and pitch changes another.","expl":"A louder sound has a larger amplitude, so the waves are taller. The pitch is the same, so the spacing between the waves does not change.","insight":"Louder sound: larger amplitude (taller trace), same frequency (same number of waves)."},
  {"t":"Pitch & Loudness","q":"Compared with a low note, how does the trace of a higher note of the same loudness look?","o":["Taller waves on the screen, with the same number","More waves on the screen, with the same height","Fewer waves on the screen, with the same height","Shorter waves on the screen, with the same number"],"a":1,"h":"Higher pitch means more vibrations each second.","expl":"A higher pitch has a higher frequency, so more waves fit on the screen and the crests are closer together. Same loudness means the same height.","insight":"Higher pitch: higher frequency (more waves, closer together), same amplitude."},
  {"t":"Pitch & Loudness","q":"Two traces are recorded with the same settings. Trace P shows 2 complete waves and trace Q shows 6 complete waves. Both have the same height. Which statement is correct?","o":["Q is the louder sound","P has the higher pitch","Q has the higher pitch","P is the louder sound"],"a":2,"h":"Count the waves to compare frequency; compare the heights for loudness.","expl":"Q has more waves in the same time, so it has the higher frequency and the higher pitch. The heights are equal, so they are equally loud.","insight":"More waves in the same time = higher frequency = higher pitch."},
  {"t":"Pitch & Loudness","q":"On a wave trace, between which two points is the amplitude measured?","o":["Start of the trace to its end","Top of a crest to the bottom of a trough","Top of one crest to the next crest","Centre line to the top of a crest"],"a":3,"h":"It is a height, measured from the rest position.","expl":"Amplitude is measured from the centre (rest) line to the top of a crest, or to the bottom of a trough. Crest to trough is twice the amplitude.","insight":"Amplitude = distance from the centre line to a crest (or to a trough), not from crest to trough."},
  {"t":"Light & Shadows","q":"Which of these is a luminous object?","o":["Mirror","Firefly","Planet","Moon"],"a":1,"h":"A luminous object gives out its own light.","expl":"A firefly produces its own light, so it is luminous. The Moon, mirrors and planets only reflect light from other sources.","insight":"Luminous objects give out their own light; non-luminous objects do not."},
  {"t":"Light & Shadows","q":"The Moon is non-luminous. Why can we see it at night?","o":["It absorbs light from the Sun and glows later","It reflects light from the Sun into our eyes","It refracts light from the Earth into our eyes","It gives out its own light during the night"],"a":1,"h":"Where does the light that reaches the Moon come from?","expl":"The Moon does not make its own light. We see it because it reflects sunlight into our eyes.","insight":"Non-luminous objects are seen because they reflect light into our eyes."},
  {"t":"Light & Shadows","q":"What is the speed of light in a vacuum?","o":["400 000 000 m/s","300 000 000 m/s","200 000 000 m/s","100 000 000 m/s"],"a":1,"h":"It can also be written as 3 × 10⁸ m/s.","expl":"Light travels at 300 000 000 m/s (3 × 10⁸ m/s) in a vacuum. It travels more slowly in water and glass.","insight":"Speed of light in a vacuum = 300 000 000 m/s (3 × 10⁸ m/s)."},
  {"t":"Light & Shadows","q":"During a thunderstorm, why do we see the lightning before we hear the thunder?","o":["Light is produced before the sound","Sound travels much faster than light","Light travels much faster than sound","Sound is absorbed by the clouds"],"a":2,"h":"Compare 300 000 000 m/s with about 340 m/s.","expl":"Lightning and thunder are produced at the same time, but light travels much faster than sound, so the light reaches us first.","insight":"Light travels much faster than sound."},
  {"t":"Light & Shadows","q":"Which observation shows that light travels in straight lines?","o":["A rainbow forms when sunlight meets raindrops","A straw looks bent in a glass of water","A sharp shadow forms behind an opaque object","A white shirt looks red under red light"],"a":2,"h":"If light could curve around things, what would be missing?","expl":"Light cannot bend around an opaque object, so a dark region with the same shape as the object forms behind it. This shows light travels in straight lines.","insight":"Shadows form because light travels in straight lines."},
  {"t":"Light & Shadows","q":"Which list gives a transparent, a translucent and an opaque material, in that order?","o":["Clear glass, tracing paper, wood","Clear glass, wood, tracing paper","Tracing paper, clear glass, wood","Wood, tracing paper, clear glass"],"a":0,"h":"All light through, some light through, no light through.","expl":"Clear glass lets almost all light through (transparent). Tracing paper lets some light through (translucent). Wood lets no light through (opaque).","insight":"Transparent: almost all light passes. Translucent: some light passes. Opaque: no light passes."},
  {"t":"Light & Shadows","q":"Why does a shadow form behind an opaque object?","o":["Light travels in straight lines and cannot pass through the object","Light is reflected by the screen and then absorbed by the object","Light bends around the edges of the object and spreads out behind it","Light travels in straight lines and is slowed down by the object"],"a":0,"h":"Two ideas are needed: how light travels, and what an opaque object does.","expl":"Light travels in straight lines. An opaque object blocks the light, so the region behind it receives no light and is dark.","insight":"A shadow is a region of darkness formed when the path of light is blocked by an opaque object."},
  {"t":"Light & Shadows","q":"What is the region of total darkness in a shadow called?","o":["Corona","Umbra","Penumbra","Spectrum"],"a":1,"h":"It is the darkest, central part of the shadow.","expl":"The umbra is the region where all the light is blocked. The penumbra is the lighter outer region where only some light is blocked.","insight":"Umbra = total shadow (all light blocked). Penumbra = partial shadow (some light blocked)."},
  {"t":"Light & Shadows","q":"A shadow has a dark centre with a lighter, fuzzy edge around it. What kind of light source produced it?","o":["A reflected source","A coloured source","A point source","An extended source"],"a":3,"h":"Light from different parts of the source reaches the edge of the shadow.","expl":"A large (extended) source gives an umbra surrounded by a penumbra, because the object blocks only part of the light at the edges. A point source gives a sharp umbra only.","insight":"Point source: sharp umbra only. Extended source: umbra surrounded by a penumbra."},
  {"t":"Light & Shadows","q":"An object is moved closer to the light source. What happens to the size of its shadow on the screen?","o":["Larger","Sharper","Smaller","Brighter"],"a":0,"h":"Nearer the source, the object blocks a wider cone of light.","expl":"When the object is closer to the light source it blocks a wider spread of light rays, so the shadow on the screen becomes larger.","insight":"The closer the object is to the light source, the larger the shadow."},
  {"t":"Light & Shadows","q":"What is the order of the Sun, Moon and Earth during a solar eclipse?","o":["Earth → Sun → Moon","Sun → Moon → Earth","Sun → Earth → Moon","Moon → Sun → Earth"],"a":1,"h":"In a solar eclipse, it is the Sun that gets hidden from us.","expl":"In a solar eclipse the Moon is between the Sun and the Earth. The Moon blocks the sunlight and its shadow falls on the Earth.","insight":"Solar eclipse: the Moon is between the Sun and the Earth, and the Moon's shadow falls on the Earth."},
  {"t":"Light & Shadows","q":"What happens during a lunar eclipse?","o":["The Earth blocks sunlight from reaching the Moon","The Moon blocks sunlight from reaching the Earth","The Sun blocks moonlight from reaching the Earth","The Earth blocks moonlight from reaching the Sun"],"a":0,"h":"In a lunar eclipse, it is the Moon that goes dark.","expl":"In a lunar eclipse the Earth is between the Sun and the Moon, so the Earth's shadow falls on the Moon.","insight":"Lunar eclipse: the Earth is between the Sun and the Moon, and the Earth's shadow falls on the Moon."},
  {"t":"Reflection","q":"A ray of light strikes a plane mirror with an angle of incidence of 40°. What is the angle of reflection?","o":["50°","40°","80°","90°"],"a":1,"h":"Use the law of reflection.","expl":"The angle of reflection is equal to the angle of incidence, so it is 40°.","insight":"Law of reflection: angle of incidence = angle of reflection (i = r)."},
  {"t":"Reflection","q":"A ray of light hits a plane mirror, making an angle of 30° with the mirror surface. What is the angle of incidence?","o":["60°","120°","30°","90°"],"a":0,"h":"Angles are measured from the normal, not from the mirror.","expl":"The normal is at 90° to the mirror. Angle of incidence = 90° − 30° = 60°.","insight":"The angle of incidence is measured between the incident ray and the normal, not the mirror surface."},
  {"t":"Reflection","q":"In a ray diagram, what is the normal?","o":["A line drawn at 90° to the surface at the point of incidence","A line drawn along the surface towards the point of incidence","A line showing the path of the ray after it leaves the surface","A line drawn at 45° to the surface at the point of incidence"],"a":0,"h":"It is usually drawn as a dashed line.","expl":"The normal is an imaginary line drawn perpendicular (at 90°) to the surface at the point where the ray hits it.","insight":"The normal is an imaginary line perpendicular (90°) to the surface at the point of incidence."},
  {"t":"Reflection","q":"The angle of incidence is the angle between which two lines?","o":["The incident ray and the reflected ray","The incident ray and the mirror","The incident ray and the normal","The reflected ray and the mirror"],"a":2,"h":"Both angles in the law of reflection are measured from the same line.","expl":"The angle of incidence is between the incident ray and the normal. The angle of reflection is between the reflected ray and the normal.","insight":"Angle of incidence: between the incident ray and the normal."},
  {"t":"Reflection","q":"Why can you see your face in a mirror but not in a sheet of white paper?","o":["The mirror is smooth and reflects parallel rays in one direction","The paper is rough and obeys a different law of reflection","The paper is rough and does not reflect any of the light","The mirror is smooth and absorbs parallel rays in one direction"],"a":0,"h":"Compare the two surfaces under a microscope.","expl":"A smooth mirror gives regular reflection: parallel rays stay parallel, so a clear image forms. Rough paper scatters the rays in all directions (diffuse reflection), so no image forms.","insight":"Regular reflection (smooth surface): parallel rays reflect in one direction and an image forms. Diffuse reflection (rough surface): rays scatter and no image forms."},
  {"t":"Reflection","q":"Which statement about diffuse reflection from a rough surface is correct?","o":["Each ray obeys the law of reflection, but rays scatter in many directions","Each ray is absorbed by the surface, so no light leaves the paper","Each ray obeys the law of reflection, so all rays stay parallel","Each ray breaks the law of reflection, so rays scatter in many directions"],"a":0,"h":"On a rough surface the normal points a different way at each point.","expl":"Every ray still obeys i = r. The surface is uneven, so the normal is in a different direction at each point and the reflected rays scatter.","insight":"In diffuse reflection each ray still obeys the law of reflection; the rays scatter because the surface is uneven."},
  {"t":"Reflection","q":"Which describes the image formed by a plane mirror?","o":["Real, upright and the same size as the object","Virtual, inverted and smaller than the object","Real, inverted and larger than the object","Virtual, upright and the same size as the object"],"a":3,"h":"Think about what you see when you look in a bathroom mirror.","expl":"A plane mirror image is the same size as the object, upright, virtual, laterally inverted, and as far behind the mirror as the object is in front.","insight":"Plane mirror image: same size, upright, virtual, laterally inverted, same distance behind the mirror as the object is in front."},
  {"t":"Reflection","q":"A girl stands 2 m in front of a plane mirror. How far is her image from her?","o":["4 m","2 m","1 m","3 m"],"a":0,"h":"The question asks for the distance from the girl, not from the mirror.","expl":"The image is 2 m behind the mirror. Distance from girl to image = 2 m + 2 m = 4 m.","insight":"Image distance behind the mirror = object distance in front of the mirror."},
  {"t":"Reflection","q":"The word AMBULANCE is printed back-to-front on the front of the vehicle so drivers can read it in their mirrors. Which property of a mirror image explains this?","o":["Greatly magnified","Slightly diminished","Laterally inverted","Vertically inverted"],"a":2,"h":"Raise your right hand in front of a mirror and watch the image.","expl":"A plane mirror image is laterally inverted, meaning left and right are swapped. The reversed word looks the right way round in a mirror.","insight":"A plane mirror image is laterally inverted (left and right are reversed)."},
  {"t":"Reflection","q":"How are we able to see a book in a room lit by a lamp?","o":["Light from the book travels to the lamp and then our eyes","Light from the lamp reflects off the book into our eyes","Light from our eyes reflects off the book to the lamp","Light from the lamp is absorbed by the book and our eyes"],"a":1,"h":"Start at the light source and follow the path of the light.","expl":"The book is non-luminous. Light from the lamp hits the book, is reflected, and enters our eyes.","insight":"We see a non-luminous object when light from a source is reflected off the object into our eyes."},
  {"t":"Refraction & Dispersion","q":"Which statement best defines refraction?","o":["The bending of light as it passes from one transparent medium into another","The splitting of light as it is absorbed by a coloured filter","The bouncing of light as it strikes the surface of a smooth mirror","The spreading of light as it passes around the edge of an obstacle"],"a":0,"h":"It happens at the boundary between two materials such as air and glass.","expl":"Refraction is the bending (change in direction) of light when it passes from one transparent medium to another.","insight":"Refraction is the bending of light as it passes from one transparent medium to another."},
  {"t":"Refraction & Dispersion","q":"What causes light to refract at the boundary between two media?","o":["A change in colour","A change in temperature","A change in brightness","A change in speed"],"a":3,"h":"Light does not travel equally fast in air, water and glass.","expl":"Light travels at different speeds in different media. The change in speed at the boundary makes the light change direction.","insight":"Refraction occurs because light changes speed when it enters a different medium."},
  {"t":"Refraction & Dispersion","q":"A ray of light passes from air into glass at an angle. What happens to it?","o":["It speeds up and bends away from the normal","It slows down and bends towards the normal","It slows down and bends away from the normal","It speeds up and bends towards the normal"],"a":1,"h":"Glass is optically denser than air.","expl":"Light travels more slowly in glass than in air. When light slows down, it bends towards the normal.","insight":"Less dense to denser medium (air to glass): light slows down and bends towards the normal."},
  {"t":"Refraction & Dispersion","q":"A ray of light passes from water into air at an angle. Which statement is correct?","o":["The angle of refraction is smaller than the angle of incidence","The angle of refraction is zero for every angle of incidence","The angle of refraction is larger than the angle of incidence","The angle of refraction is equal to the angle of incidence"],"a":2,"h":"Light speeds up when it leaves water. Which way does it bend?","expl":"From water to air, light speeds up and bends away from the normal, so the angle of refraction is larger than the angle of incidence.","insight":"Denser to less dense medium (water to air): light speeds up and bends away from the normal, so angle r > angle i."},
  {"t":"Refraction & Dispersion","q":"A ray of light enters a glass block along the normal. What happens to it?","o":["It slows down but does not change direction","It speeds up and bends away from the normal","It slows down and bends towards the normal","It keeps the same speed and the same direction"],"a":0,"h":"The angle of incidence here is 0°.","expl":"The ray still slows down in the glass, but because it hits the boundary at 90° to the surface it passes straight through without bending.","insight":"A ray travelling along the normal changes speed but does not bend."},
  {"t":"Refraction & Dispersion","q":"A ray of light passes through a rectangular glass block and comes out the other side. How is the emergent ray related to the incident ray?","o":["Parallel to the incident ray","Along the same normal line","Perpendicular to the incident ray","Reflected back into the glass"],"a":0,"h":"The ray bends one way going in and the opposite way coming out.","expl":"The ray bends towards the normal on entering and away from the normal by the same amount on leaving, so the emergent ray is parallel to the incident ray but shifted sideways.","insight":"For a rectangular glass block, the emergent ray is parallel to the incident ray."},
  {"t":"Refraction & Dispersion","q":"Why does a swimming pool look shallower than it really is?","o":["Light from the bottom is reflected back down by the water surface","Light from the bottom bends towards the normal as it leaves the water","Light from the bottom is absorbed and slowed as it leaves the water","Light from the bottom bends away from the normal as it leaves the water"],"a":3,"h":"Follow a ray from the bottom of the pool to your eye.","expl":"Light leaving the water speeds up and bends away from the normal. Our eyes trace the rays back in straight lines, so the bottom appears closer to the surface than it is.","insight":"Apparent depth: light bends away from the normal as it passes from water to air, so objects appear closer to the surface."},
  {"t":"Refraction & Dispersion","q":"Which list puts the media in order of the speed of light in them, from fastest to slowest?","o":["Air, water, glass","Glass, water, air","Water, air, glass","Air, glass, water"],"a":0,"h":"Light is slowest in the optically densest medium.","expl":"Light travels fastest in a vacuum or air, slower in water, and slower still in glass.","insight":"Speed of light: fastest in vacuum/air, slower in water, slowest in glass."},
  {"t":"Refraction & Dispersion","q":"What is the splitting of white light into its colours by a prism called?","o":["Reflection","Dispersion","Absorption","Diffusion"],"a":1,"h":"The colours are spread out, or 'dispersed'.","expl":"Dispersion is the splitting of white light into its component colours when it passes through a prism.","insight":"Dispersion is the splitting of white light into its component colours."},
  {"t":"Refraction & Dispersion","q":"Which colour of light is refracted the most by a glass prism?","o":["Red","Green","Yellow","Violet"],"a":3,"h":"It is at one end of the spectrum: ROYGBIV.","expl":"Violet light slows down the most in glass, so it bends the most. Red slows down the least and bends the least.","insight":"Violet is refracted the most; red is refracted the least."},
  {"t":"Refraction & Dispersion","q":"Which colour is refracted the least by a glass prism, and why?","o":["Red, because it slows down the most in glass","Violet, because it slows down the least in glass","Violet, because it slows down the most in glass","Red, because it slows down the least in glass"],"a":3,"h":"The smaller the change in speed, the smaller the bend.","expl":"Different colours travel at different speeds in glass. Red light slows down the least, so it is refracted the least.","insight":"Dispersion happens because different colours travel at different speeds in glass, so they are refracted by different amounts."},
