<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 8 History - Introduction and Imperialism</title>
<style>
:root{--bg:#f5f6fa;--ink:#1a1a2e;--muted:#5c5f73;--navy:#1a1a2e;--ok:#2e7d32;--bad:#c62828;--half:#f57c00;--card:#fff;--line:#e3e5ee}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:18px;margin-bottom:14px}
.hidden{display:none!important}
/* Home */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:6px 0 10px}
h1{font-size:1.55rem;font-weight:800;line-height:1.2}
.ver{font-size:.75rem;color:var(--muted);white-space:nowrap;padding-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pill{background:#fff;border:1.5px solid;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.stats{display:flex;gap:12px;margin-bottom:12px}
.stat{flex:1;text-align:center;background:var(--bg);border-radius:10px;padding:10px}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.bar{height:10px;background:#e8eaf2;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .8s ease}
.pct{font-size:.8rem;color:var(--muted);text-align:right;margin-top:4px}
.how{font-size:.88rem;color:var(--muted);margin-top:10px}
.notice{font-size:.88rem;background:#fff4e5;border:1px solid #ffd59e;color:#7a4300;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.btn{display:block;width:100%;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--navy);color:#fff}
.danger{background:#fff;color:var(--bad);border:2px solid var(--bad);margin-top:10px}
.btns{margin-bottom:16px}
.topics{display:grid;grid-template-columns:1fr;gap:10px}
.topics.two{grid-template-columns:1fr 1fr}
.tcard{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:12px 14px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tname{font-weight:700;font-size:.95rem}
.tmeta{font-size:.82rem;color:var(--muted);white-space:nowrap}
.half{color:var(--half);font-weight:700;margin-right:6px;cursor:help}
/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.badge{border:1.5px solid;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:#fff}
.qcount{font-size:.88rem;color:var(--muted);font-weight:600}
.home-link{background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;font-family:inherit;text-decoration:underline;margin-bottom:8px}
.qtext{font-size:1.2rem;font-weight:700;text-align:center;margin:6px 0 14px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--half);border:1px solid var(--half);border-radius:6px;padding:1px 6px;margin-bottom:8px}
.hintbtn{background:#fff;border:1.5px dashed #9aa0b8;color:var(--ink);border-radius:10px;padding:9px 12px;width:100%;font-size:.9rem;cursor:pointer;font-family:inherit;text-align:left}
.hintbtn:disabled{background:#eceef3;color:#9a9db0;border-color:#cfd2dc;cursor:not-allowed}
.hint{margin-top:8px;font-size:.9rem;background:#f3f5ff;border-radius:10px;padding:10px 12px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid var(--line);border-radius:10px;padding:13px 14px;font-size:.98rem;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);transition:background .15s,border-color .15s,color .15s}
.opt:hover:not(:disabled){border-color:#9aa0b8}
.opt:disabled{cursor:default}
.opt.correct{background:#e8f5e9;border-color:var(--ok);color:#1b5e20;font-weight:600}
.opt.wrong{background:#ffebee;border-color:var(--bad);color:#8e1c1c}
.verdict{font-weight:800;margin-top:14px}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}
.expl{margin-top:8px;font-size:.93rem}
.insight{margin-top:10px;border:1.5px solid #c5cae9;background:#f5f6ff;border-radius:10px;padding:10px 12px;font-size:.92rem}
.insight b{display:block;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:#3949ab;margin-bottom:3px}
.nextbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(245,246,250,0))}
.nextbar .btn{max-width:608px;margin:0 auto}
/* Results */
.score{font-size:2.6rem;font-weight:800;text-align:center}
.sub{text-align:center;color:var(--muted);margin-bottom:10px}
.done{display:block;text-align:center;background:#e8f5e9;color:var(--ok);border-radius:999px;padding:6px 12px;font-weight:700;margin:8px auto 0;width:max-content;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th:not(:first-child),td:not(:first-child){text-align:center}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(26,26,46,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .card{max-width:380px;width:100%;text-align:center}
.modal p{margin:6px 0 16px;font-weight:600}
.mbtns{display:flex;gap:10px}
.mbtns .btn{margin:0}
.ghost{background:#eceef3;color:var(--ink)}
.confirm{background:var(--bad);color:#fff}
@media (max-width:400px){h1{font-size:1.35rem}.qtext{font-size:1.08rem}.topics.two .tcard{padding:10px}}
</style>
</head>
<body>
<div class="app">

<section id="home">
  <div class="top"><h1 id="title"></h1><span class="ver" id="ver"></span></div>
  <div class="pills" id="pills"></div>
  <div class="card">
    <div class="stats">
      <div class="stat"><b id="nActive">0</b><span>Active Questions</span></div>

  <div class="btns">

  <div class="topics" id="topics"></div>

<section id="quiz" class="hidden">

    <div class="qtext" id="qText"></div>
    <button class="hintbtn" id="hintBtn"></button>
    <div class="hint hidden" id="hintBox"></div>
    <div class="opts" id="opts"></div>
    <div id="feedback" class="hidden">
      <div class="verdict" id="verdict"></div>
      <div class="expl" id="expl"></div>
      <div class="insight"><b>Key insight</b><span id="insight"></span></div>
    </div>
  </div>
  <div class="nextbar hidden" id="nextBar"><button class="btn primary" id="btnNext">Next →</button></div>
</section>

<section id="results" class="hidden">
  <div class="card">
    <div class="sub">Session score</div>
    <div class="score" id="rScore"></div>
    <span class="done hidden" id="rDone"></span>
  </div>
  <div class="card">
    <table><thead><tr><th>Topic</th><th>Correct</th><th>Drawn this session</th></tr></thead><tbody id="rTable"></tbody></table>
  </div>
  <button class="btn primary" id="btnBack">Continue Studying →</button>
</section>

</div>

<div class="modal hidden" id="modal">
  <div class="card">
    <div style="font-size:1.6rem">⚠️</div>
    <p>This will erase all your progress. Are you sure?</p>
    <div class="mbtns"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn confirm" id="mConfirm">Confirm</button></div>
  </div>
</div>

BANK.forEach((q, i) => q.id = i);

const TOPICS = [...new Set(BANK.map(q => q.t))];
const COLORS = ["#3949ab", "#00897b", "#8e24aa", "#d81b60", "#6d4c41", "#0277bd", "#558b2f", "#ef6c00"];
const colorOf = t => COLORS[TOPICS.indexOf(t) % COLORS.length];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Storage (safe) ---------- */
function freshState() { return { ledger: {} }; }
function loadState() {
  try {
    if (typeof localStorage === "undefined" || !localStorage) return freshState();
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return freshState();
    const s = JSON.parse(raw);
    if (!s || typeof s !== "object" || !s.ledger || typeof s.ledger !== "object") return freshState();
    return s;
  } catch (e) { return freshState(); }
}
function saveState() {
  try { if (typeof localStorage !== "undefined" && localStorage) localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
let state = loadState();
function L(id) {
  let e = state.ledger[id];
  if (!e || typeof e !== "object") e = state.ledger[id] = { streak: 0, status: "active", lastCorrect: 0 };
  if (typeof e.streak !== "number") e.streak = 0;
  if (e.status !== "mastered") e.status = "active";
  return e;
}

/* ---------- Eligibility ---------- */
const isFinalPass = q => L(q.id).streak === STREAK_TO_MASTER - 1;
function readyAt(q) {
  const e = L(q.id);
  if (FINAL_PASS_SPACING_MS > 0 && e.streak === STREAK_TO_MASTER - 1) return (e.lastCorrect || 0) + FINAL_PASS_SPACING_MS;
  return 0;
}
const isEligible = (q, now) => L(q.id).status === "active" && readyAt(q) <= now;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Home ---------- */
function fmtWait(ms) { const m = Math.ceil(ms / 60000); return m <= 1 ? "about 1 minute" : m + " minutes"; }
let noticeTimer = null;
function renderHome() {
  show("home");
  $("title").textContent = QUIZ_NAME;
  $("ver").textContent = VERSION;
  document.title = QUIZ_NAME;
  $("pills").innerHTML = TOPICS.map(t => `<span class="pill" style="border-color:${colorOf(t)};color:${colorOf(t)}">${esc(t)}</span>`).join("");
  const total = BANK.length;
  const done = BANK.filter(q => L(q.id).status === "mastered").length;
  $("nActive").textContent = total - done;
  $("nDone").textContent = done;
  const pct = Math.round(100 * done / total);
  $("mainPct").textContent = pct + "% complete";
  $("how").textContent = `Answer correctly ${STREAK_TO_MASTER} times in a row to complete a question. A wrong answer resets your progress on that question. Work through all ${total} questions to finish.`;
  const tw = $("topics");
  tw.className = "topics" + (TOPICS.length >= 7 ? " two" : "");
  tw.innerHTML = TOPICS.map(t => {
    const qs = BANK.filter(q => q.t === t);
    const m = qs.filter(q => L(q.id).status === "mastered").length;
    const halfN = qs.filter(q => L(q.id).status === "active" && L(q.id).streak > 0).length;
    const half = halfN > 0 ? `<span class="half" title="One more correct answer to complete these">▶${halfN}</span>` : "";
    return `<div class="tcard"><div class="trow"><span class="tname" style="color:${colorOf(t)}">${esc(t)}</span><span class="tmeta">${half}${m}/${qs.length}</span></div><div class="bar"><i data-w="${Math.round(100 * m / qs.length)}" style="background:${colorOf(t)}"></i></div></div>`;
  }).join("");
  const main = $("mainBar"); main.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    main.style.width = pct + "%";
    tw.querySelectorAll(".bar i").forEach(b => b.style.width = b.dataset.w + "%");
  }));
  updateNotice();
  clearInterval(noticeTimer);
  noticeTimer = setInterval(updateNotice, 15000);
}
function updateNotice() {
  const now = Date.now();
  const active = BANK.filter(q => L(q.id).status === "active");
  const eligible = active.filter(q => isEligible(q, now));
  const resting = active.filter(q => !isEligible(q, now));
  const n = $("notice"), go = $("btnGo");
  go.disabled = false;
  go.textContent = "▶ Continue Progress";
  if (active.length === 0) {
    n.textContent = "🎉 You've completed every question! Use \"Start All Over\" if you'd like to practice again.";
    n.classList.remove("hidden"); go.disabled = true; return;
  }
  if (resting.length && eligible.length < QS_PER_ROUND) {
    const soon = Math.min(...resting.map(readyAt)) - now;
    const restMsg = `${resting.length} question${resting.length > 1 ? "s are" : " is"} resting before a final check (next ready in ${fmtWait(soon)}).`;
    n.textContent = eligible.length === 0
      ? restMsg + " You can practice them now, but practice answers won't count toward completing them."
      : restMsg + ` This round will include ${eligible.length} counted question${eligible.length > 1 ? "s" : ""}` + (eligible.length + resting.length > eligible.length ? ", topped up with practice questions." : ".");
    n.classList.remove("hidden");
    if (eligible.length === 0) go.textContent = "▶ Practice Now";
  } else n.classList.add("hidden");
}

/* ---------- Session ---------- */
let session = null;
function startSession() {
  const now = Date.now();
  const active = BANK.filter(q => L(q.id).status === "active");
  const eligible = shuffle(active.filter(q => isEligible(q, now)));
  let items = eligible.slice(0, QS_PER_ROUND).map(q => ({ q, practice: false }));
  if (items.length < QS_PER_ROUND) {
    // Relief valve: top up with resting questions as practice-only (they don't affect progress)
    const resting = active.filter(q => !isEligible(q, now)).sort((a, b) => readyAt(a) - readyAt(b));
    items = items.concat(resting.slice(0, QS_PER_ROUND - items.length).map(q => ({ q, practice: true })));
    items = shuffle(items);
  }
  if (!items.length) return;
  session = { items, i: 0, results: [], completed: 0 };
  clearInterval(noticeTimer);
  renderQuestion();
}
function renderQuestion() {
  show("quiz");
  window.scrollTo(0, 0);
  const it = session.items[session.i], q = it.q, c = colorOf(q.t);
  const b = $("qBadge"); b.textContent = q.t; b.style.borderColor = c; b.style.color = c;
  $("qCount").textContent = `Q ${session.i + 1} of ${session.items.length}`;
  $("qTag").classList.toggle("hidden", !it.practice);
  $("qText").textContent = q.q;
  const hb = $("hintBtn"), hx = $("hintBox");
  hx.classList.add("hidden"); hx.textContent = q.h;
  const finalPass = !it.practice && isFinalPass(q);
  hb.disabled = finalPass;
  hb.textContent = finalPass ? "💡 Hint unavailable on the final check" : "💡 Show hint";
  hb.onclick = () => { const open = hx.classList.toggle("hidden") === false; hb.textContent = open ? "💡 Hide hint" : "💡 Show hint"; };
  const order = shuffle(q.o.map((text, idx) => ({ text, idx })));
  const box = $("opts"); box.innerHTML = "";
  order.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "opt"; btn.textContent = o.text; btn.dataset.idx = o.idx;
    btn.onclick = () => answer(o.idx);
    box.appendChild(btn);
  });
  $("feedback").classList.add("hidden");
  $("nextBar").classList.add("hidden");
}
function answer(idx) {
  const it = session.items[session.i], q = it.q, ok = idx === q.a;
  $("opts").querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const bi = +b.dataset.idx;
    if (bi === q.a) b.classList.add("correct");
    else if (bi === idx) b.classList.add("wrong");
  });
  $("hintBtn").disabled = true;
  let completedNow = false;
  if (!it.practice) {
    const e = L(q.id);
    if (ok) {
      e.streak++; e.lastCorrect = Date.now();
      if (e.streak >= STREAK_TO_MASTER) { e.status = "mastered"; completedNow = true; session.completed++; }
    } else e.streak = 0;
    saveState(); // save immediately after every answer
  }
  session.results.push({ t: q.t, ok });
  const v = $("verdict");
  v.className = "verdict " + (ok ? "ok" : "no");
  v.textContent = ok ? (completedNow ? "✓ Correct! Question completed 🎉" : "✓ Correct!") : "✗ Not quite.";
  $("expl").textContent = q.expl;
  $("insight").textContent = q.insight;
  $("feedback").classList.remove("hidden");
  $("btnNext").textContent = session.i + 1 < session.items.length ? "Next →" : "See Results →";
  $("nextBar").classList.remove("hidden");
}
function next() {
  session.i++;
  if (session.i < session.items.length) renderQuestion(); else renderResults();
}
function renderResults() {
  show("results");
  window.scrollTo(0, 0);
  const r = session.results, right = r.filter(x => x.ok).length;
  $("rScore").textContent = `${right} / ${r.length} correct`;
  const d = $("rDone");
  if (session.completed > 0) { d.textContent = `+ ${session.completed} question${session.completed > 1 ? "s" : ""} completed this session`; d.classList.remove("hidden"); }
  else d.classList.add("hidden");
  $("rTable").innerHTML = TOPICS.filter(t => r.some(x => x.t === t)).map(t => {
    const rows = r.filter(x => x.t === t);
    return `<tr><td style="color:${colorOf(t)};font-weight:700">${esc(t)}</td><td>${rows.filter(x => x.ok).length}</td><td>${rows.length}</td></tr>`;
  }).join("");
}

/* ---------- UI plumbing ---------- */
function show(id) { ["home", "quiz", "results"].forEach(s => $(s).classList.toggle("hidden", s !== id)); }
$("btnGo").onclick = startSession;
$("btnNext").onclick = next;
$("btnBack").onclick = renderHome;
$("btnQuit").onclick = () => { session = null; renderHome(); };
$("btnReset").onclick = () => $("modal").classList.remove("hidden");
$("mCancel").onclick = () => $("modal").classList.add("hidden");
$("mConfirm").onclick = () => {
  try { if (typeof localStorage !== "undefined" && localStorage) localStorage.removeItem(LS_KEY); } catch (e) {}
  state = freshState();
  $("modal").classList.add("hidden");
  renderHome();
};
renderHome();
</script>
